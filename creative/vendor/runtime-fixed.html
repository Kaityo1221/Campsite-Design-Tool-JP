<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CREATIVE MODE | Campsite Lab</title>
</head>
<body>
<script>
(async()=>{
  try{
    const res=await fetch('./runtime-vnext.html',{cache:'no-store'});
    if(!res.ok)throw new Error('runtime-vnext.html の読み込みに失敗しました');
    let src=await res.text();

    // 「＋追加」から新規POI種別を上方向に展開して、そのまま配置モードへ入る。
    // 種別ボタンは selectTool('add') のトグルを使わず、常に追加モードを再起動する。
    // ポリゴンは1個目は即作成。既存ポリゴンがある時だけ確認ダイアログで「新規作成 / 削除 / キャンセル」を選ぶ。
    src=src.replace("let html=await res.text();",`let html=await res.text();
  // base-v7本体の追加/移動バーを保存・工具箱と同じ下端ラインへ下げる。
  html=html.split("bottom:'calc(132px + env(safe-area-inset-bottom))'").join("bottom:'calc(72px + env(safe-area-inset-bottom))'");
  html=html.replace('<div id="toolMenu" class="toolmenu"><button data-tool="add">＋ 追加</button><button data-tool="polygon">ポリゴン</button><button data-tool="ruler">物差し</button></div>','<div id="toolMenu" class="toolmenu"><div id="addKinds" class="add-kinds"><button type="button" data-add-layer="new-pokestop">🔵 PokéStop</button><button type="button" data-add-layer="new-gym">🟡 Gym</button><button type="button" data-add-layer="new-power">🟣 PowerSpot</button></div><button type="button" id="addToggle">＋ 追加</button><button type="button" id="polygonToggle">ポリゴン</button><button data-tool="ruler">物差し</button></div><div id="polygonChoice" class="polygon-choice"><div class="polygon-choice-card"><strong>すでにポリゴンがあります</strong><p>どうしますか？</p><button type="button" id="polygonNew">新規作成</button><button type="button" id="polygonDelete">削除する</button><button type="button" id="polygonCancel">キャンセル</button></div></div>');
  html=html.replace('</style>', '.add-kinds{display:none;gap:6px}.add-kinds.open{display:grid}.add-kinds button{min-height:42px;text-align:left;padding-left:14px}.toolmenu #addToggle.active,.toolmenu #polygonToggle.active{background:var(--gold)}.polygon-choice{display:none;position:fixed;inset:0;z-index:2600;background:rgba(0,0,0,.42);align-items:center;justify-content:center;padding:18px}.polygon-choice.open{display:flex}.polygon-choice-card{width:min(340px,90vw);padding:16px;border:2px solid #8a6b31;border-radius:18px;background:#fffdf7;box-shadow:0 12px 34px rgba(0,0,0,.35);display:grid;gap:9px;text-align:center}.polygon-choice-card strong{font-size:17px}.polygon-choice-card p{margin:0 0 4px;font-size:13px}.polygon-choice-card button{min-height:46px;border:1px solid #b89a57;border-radius:12px;background:#fff8e6;color:var(--ink);font-weight:900}.polygon-choice-card #polygonDelete{background:#fff0ee;color:#8c2f28;border-color:#c88179}.polygon-choice-card #polygonCancel{background:#f3efe6} </style>');
  html=html.replace("function renderTools(){toolMenu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tool===activeTool))}toolMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));$('toolbox').onclick=()=>{const opening=!toolMenu.classList.contains('open');closeMenus();if(opening)toolMenu.classList.add('open')};", "function renderTools(){toolMenu.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===activeTool));const at=$('addToggle'),pt=$('polygonToggle');if(at)at.classList.toggle('active',activeTool==='add');if(pt)pt.classList.toggle('active',activeTool==='polygon')}toolMenu.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));const addKinds=$('addKinds'),addToggle=$('addToggle'),polygonToggle=$('polygonToggle'),polygonChoice=$('polygonChoice'),polygonNew=$('polygonNew'),polygonDelete=$('polygonDelete'),polygonCancel=$('polygonCancel');const closePolygonChoice=()=>polygonChoice?.classList.remove('open');if(addToggle)addToggle.onclick=()=>{closePolygonChoice();const opening=!addKinds.classList.contains('open');addKinds.classList.toggle('open',opening)};toolMenu.querySelectorAll('[data-add-layer]').forEach(b=>b.onclick=()=>{activeLayer=b.dataset.addLayer;renderLayerPanel();addKinds.classList.remove('open');if(activeTool==='polygon'){map.off('move',updatePolyPreview);clearPolyDraft()}if(activeTool==='ruler')clearRuler();activeTool='add';clearDraft();addDraft();renderTools();msg('追加：'+(layerDefs.find(x=>x[0]===activeLayer)?.[1]||activeLayer),1200)});if(polygonToggle)polygonToggle.onclick=()=>{addKinds?.classList.remove('open');const hasPolygon=polygons.some(p=>!p.deleted);if(!hasPolygon){selectTool('polygon');return}closeMenus();polygonChoice?.classList.add('open')};if(polygonNew)polygonNew.onclick=()=>{closePolygonChoice();if(typeof beginAnotherPolygon==='function')beginAnotherPolygon();else selectTool('polygon')};if(polygonDelete)polygonDelete.onclick=()=>{closePolygonChoice();if(typeof beginPolygonDeleteMode==='function')beginPolygonDeleteMode();else msg('ポリゴン削除を開始できませんでした')};if(polygonCancel)polygonCancel.onclick=closePolygonChoice;if(polygonChoice)polygonChoice.onclick=e=>{if(e.target===polygonChoice)closePolygonChoice()};$('toolbox').onclick=()=>{const opening=!toolMenu.classList.contains('open');closeMenus();if(!opening){addKinds?.classList.remove('open');closePolygonChoice()}if(opening)toolMenu.classList.add('open')};");`);

    // CSVはKML Placemark用inferLayer()へ渡さず、CSV列/ファイル名から直接6レイヤーへ分類する。
    const old="const layer=inferLayer(file.name,title);";
    const replacement="const explicit=String(csvPick(o,['nextlab-layer','nextlab_layer','layer','Layer'])||'').trim(),type=String(csvPick(o,['gameEntity','GameEntity','game_entity','Game Entity','type','Type','category','Category','種類'])||''),state=String(csvPick(o,['gameStatus','GameStatus','game_status','Game Status','status','Status'])||''),hint=(file.name+' '+title+' '+type+' '+state).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(hint);const layer=layerKeys.has(explicit)?explicit:(layerByLabel.get(explicit)||(/gym|ジム/.test(hint)?(fresh?'new-gym':'existing-gym'):/power|パワー/.test(hint)?(fresh?'new-power':'existing-power'):(fresh?'new-pokestop':'existing-pokestop')));";
    if(src.includes(old))src=src.replace(old,replacement);

    // iPhoneのファイルピッカーではaccept指定によりKMZがグレーアウトする場合があるため、選択後にアプリ側で判定する。
    src=src.replace(/<input id="entryFile" type="file" multiple accept="[^"]*">/g,'<input id="entryFile" type="file" multiple>');
    src=src.replace(/<input id="entryFile" type="file"[^>]*>/g,'<input id="entryFile" type="file" multiple>');

    // Safariのページ拡大をUI上だけ止める。#map上のマルチタッチはLeafletへ渡す。
    src=src.replace(/<meta name="viewport"[^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover,user-scalable=no">');
    src=src.replace('</head>',`<style>
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
.panel,.toolmenu,.topbtn,.bottom-bar,.save,.toolbox,.leaflet-popup,.entry{touch-action:none}
#map{touch-action:none}
</style></head>`);
    src=src.replace('</body>',`<script>(()=>{
  const isMapTarget=t=>!!(t&&t.closest&&t.closest('#map'));
  const stopUiPinch=e=>{if(e.touches&&e.touches.length>1&&!isMapTarget(e.target))e.preventDefault()};
  document.addEventListener('touchstart',stopUiPinch,{passive:false,capture:true});
  document.addEventListener('touchmove',stopUiPinch,{passive:false,capture:true});
  const blockGesture=e=>{if(!isMapTarget(e.target))e.preventDefault()};
  document.addEventListener('gesturestart',blockGesture,{passive:false,capture:true});
  document.addEventListener('gesturechange',blockGesture,{passive:false,capture:true});
  document.addEventListener('gestureend',blockGesture,{passive:false,capture:true});
})();<\/script></body>`);

    document.open();document.write(src);document.close();
  }catch(e){
    console.error(e);
    document.body.textContent=e?.message||'Creative Modeの読み込みに失敗しました。';
  }
})();
</script>
</body>
</html>
