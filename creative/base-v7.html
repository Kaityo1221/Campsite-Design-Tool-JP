<body class="right-hand">
<div id="entry" class="entry"><div class="entry-inner"><h1 class="entry-title">CREATIVE MODE</h1><p class="entry-copy">地図をひらいて、キャンプサイトを描こう。</p><div class="entry-panel"><label class="filebar"><span>📂</span><strong>KMZ / KMLを選択</strong><span id="entryFileName" class="filename">未選択</span><input id="entryFile" type="file"></label><div class="handed"><button id="leftHand">左利き</button><button id="rightHand" class="active">右利き</button></div><button id="startButton" class="start" disabled>CREATIVE MODEを開始</button><button id="resumeButton" class="resume">前回の続きから</button><div id="entryState" class="entry-state">ファイルを選択してください。</div><div class="entry-note">編集内容は自動保存されます。</div></div></div></div>
<div id="map"></div><div id="mapLicense" class="map-license"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div><button id="back" class="topbtn back">← 戻る</button><button id="mapToggle" class="topbtn map-toggle">地図切り替え</button><button id="layerButton" class="topbtn layer-btn">▱ レイヤー</button><button id="circleButton" class="topbtn circle-btn">◎ 距離円</button><div id="status" class="status fade">準備中</div>
<button id="toolbox" class="toolbox">🧰</button><div id="toolMenu" class="toolmenu"><button data-tool="add">＋ 追加</button><button data-tool="polygon">ポリゴン</button><button data-tool="ruler">物差し</button></div>
<div id="layerPanel" class="panel"><h3>▱ レイヤー</h3><div id="layerRows"></div></div><div id="circlePanel" class="panel circle-panel"><h3>◎ 距離円</h3><button data-circle="50" class="active" disabled>50m（必須）</button><button data-extra="40">＋ 40m</button><button data-extra="30">＋ 30m</button></div>
<button id="save" class="save">💾 保存</button><div class="bottom-bar"><button id="undo">↩ 戻る</button><button id="locate">◎ 現在地</button><button id="redo">↪ やり直し</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{'use strict';
const STORE='next-lab-creative-v7',HAND='next-lab-creative-hand';
const layerDefs=[['existing-pokestop','既存 PokéStop','#3f89c9'],['existing-gym','既存 Gym','#d85454'],['existing-power','既存 PowerSpot','#8656b8'],['new-pokestop','新規 PokéStop','#2F80ED'],['new-gym','新規 Gym','#C69200'],['new-power','新規 PowerSpot','#9D6BD1']];
const layerKeys=new Set(layerDefs.map(([k])=>k));
const layerByLabel=new Map(layerDefs.map(([k,label])=>[label,k]));
const $=id=>document.getElementById(id),entry=$('entry'),entryFile=$('entryFile'),start=$('startButton'),resume=$('resumeButton'),status=$('status'),toolMenu=$('toolMenu'),layerPanel=$('layerPanel'),circlePanel=$('circlePanel');
const map=L.map('map',{zoomControl:false}).setView([35.6812,139.7671],16);map.createPane('distance');map.getPane('distance').classList.add('distance-pane');map.createPane('polygon');map.getPane('polygon').classList.add('polygon-pane');map.createPane('placement');map.getPane('placement').classList.add('placement-pane');map.createPane('ruler');map.getPane('ruler').classList.add('ruler-pane');map.attributionControl.setPosition('bottomleft');map.attributionControl.setPrefix(false);
const base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map),aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});
const circleRenderer=L.canvas({padding:.5,pane:'distance'});
let aerialOn=false,sourceName='campsite',sourceText='',sourceZip=null,sourceKmlPath='doc.kml',sourceIsKmz=true,pendingFile=null,activeLayer='new-pokestop',circleMode='50',circleExtras=[],activeTool='',draft=null,records=[],polygons=[],polygonVisible=true,ruler=null,currentMarker=null,currentWatch=null,currentBest=Infinity,currentStarted=0;const groups={},undoStack=[],redoStack=[];layerDefs.forEach(([k])=>groups[k]=L.layerGroup().addTo(map));const polygonGroup=L.layerGroup().addTo(map),recordCircleGroup=L.layerGroup().addTo(map);
function msg(t,ms=1300){status.classList.remove('fade');status.textContent=t;if(ms)setTimeout(()=>status.classList.add('fade'),ms)}
function closeMenus(){toolMenu.classList.remove('open');layerPanel.classList.remove('open');circlePanel.classList.remove('open')}
function setHand(h){document.body.className=h==='left'?'left-hand':'right-hand';localStorage.setItem(HAND,h);$('leftHand').classList.toggle('active',h==='left');$('rightHand').classList.toggle('active',h!=='left')}setHand(localStorage.getItem(HAND)||'right');$('leftHand').onclick=()=>setHand('left');$('rightHand').onclick=()=>setHand('right');
const color=k=>layerDefs.find(x=>x[0]===k)?.[2]||'#777',isNew=k=>k.startsWith('new-');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
function explicitLayer(pm){for(const data of pm.getElementsByTagNameNS('*','Data')){if((data.getAttribute('name')||'').trim()!=='nextlab-layer')continue;const value=[...data.children].find(x=>x.localName==='value')?.textContent?.trim()||data.textContent?.trim()||'';if(layerKeys.has(value))return value}return''}
function inferLayer(pm,f,n){const explicit=explicitLayer(pm);if(explicit)return explicit;const exact=layerByLabel.get(String(f||'').trim());if(exact)return exact;const style=(child(pm,'styleUrl')||'').replace(/^#/,'');if(style.startsWith('creative-')){const styled=style.slice('creative-'.length);if(layerKeys.has(styled))return styled}const h=(f+' '+n).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(h);if(/gym|ジム/.test(h))return fresh?'new-gym':'existing-gym';if(/power|パワー/.test(h))return fresh?'new-power':'existing-power';return fresh?'new-pokestop':'existing-pokestop'}
function renderLayerPanel(){const root=$('layerRows');root.innerHTML='';layerDefs.forEach(([k,label])=>{const row=document.createElement('div');row.className='layer-row';const b=document.createElement('button');b.textContent=label;b.classList.toggle('active',activeLayer===k);b.onclick=()=>{activeLayer=k;renderLayerPanel();msg('追加先：'+label)};const c=document.createElement('input');c.type='checkbox';c.checked=map.hasLayer(groups[k]);c.onchange=()=>{c.checked?groups[k].addTo(map):map.removeLayer(groups[k]);renderRecordCircles()};row.append(b,c);root.append(row)});const row=document.createElement('div');row.className='layer-row';const b=document.createElement('button');const count=polygons.filter(p=>!p.deleted).length;b.textContent=count?'ポリゴン (1)':'ポリゴン';b.disabled=true;b.title='表示 / 非表示のみ';const c=document.createElement('input');c.type='checkbox';c.disabled=count===0;c.checked=count>0&&polygonVisible;c.onchange=()=>{polygonVisible=c.checked;polygonVisible?polygonGroup.addTo(map):map.removeLayer(polygonGroup)};row.append(b,c);root.append(row)}renderLayerPanel();
function recordIcon(r){const pin={'new-pokestop':'https://maps.google.com/mapfiles/ms/icons/blue-dot.png','new-gym':'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png','new-power':'https://maps.google.com/mapfiles/ms/icons/purple-dot.png'}[r.layer];if(pin)return L.icon({iconUrl:pin,iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-30]});const c=color(r.layer);return L.divIcon({className:'',html:`<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="${c}" stroke="#fff" stroke-width="1.5"/><circle cx="14" cy="14" r="5.5" fill="#fff"/></svg>`,iconSize:[28,28],iconAnchor:[14,14]})}
function drawRecord(r){if(r.deleted)return;const icon=recordIcon(r);r.marker=L.marker(r.latlng,{icon}).addTo(groups[r.layer]);r.marker.on('click',()=>recordPopup(r))}
function editRecordView(wrap,r,popup){const edit=wrap.querySelector('.popup-edit');edit.classList.add('open');wrap.querySelector('#editTitle').value=r.title||'';wrap.querySelector('#editMemo').value=r.memo||'';wrap.querySelector('#saveEdit').onclick=()=>{r.title=wrap.querySelector('#editTitle').value.trim()||layerDefs.find(x=>x[0]===r.layer)?.[1]||'名称なし';r.memo=wrap.querySelector('#editMemo').value.trim();drawAll();snapshot();map.closePopup(popup);msg('編集しました')}}
function recordPopup(r){closeMenus();const wrap=document.createElement('div');wrap.className='popup-form';wrap.innerHTML=`<div class="popup-head"><button id="editBtn">✏️ 編集</button><button id="deleteBtn" class="danger">Delete</button></div><div class="popup-title">${esc(r.title||'名称なし')}</div><div class="popup-layer">${esc(layerDefs.find(x=>x[0]===r.layer)?.[1]||r.layer)}</div><div class="popup-edit"><input id="editTitle" placeholder="タイトル"><textarea id="editMemo" placeholder="メモ"></textarea><button id="saveEdit">保存</button></div><div class="popup-actions"><select id="moveLayer">${layerDefs.map(([k,l])=>`<option value="${k}" ${k===r.layer?'selected':''}>${l}</option>`).join('')}</select><button id="applyLayer">このレイヤーへ移動</button>${isNew(r.layer)?'<button id="movePos">位置を調整</button>':''}</div>`;const p=L.popup({offset:[0,-8],closeButton:false}).setLatLng(r.latlng).setContent(wrap).openOn(map);setTimeout(()=>{wrap.querySelector('#editBtn').onclick=()=>editRecordView(wrap,r,p);wrap.querySelector('#deleteBtn').onclick=()=>{if(!confirm('このスポットを削除しますか？'))return;r.deleted=true;pushHistory({type:'delete',id:r.id});drawAll();snapshot();map.closePopup(p);msg('削除しました')};wrap.querySelector('#applyLayer').onclick=()=>{const from=r.layer,to=wrap.querySelector('#moveLayer').value;if(from!==to){r.layer=to;pushHistory({type:'layer',id:r.id,from,to});drawAll();snapshot();msg('レイヤーを移動しました')}map.closePopup(p)};const mp=wrap.querySelector('#movePos');if(mp)mp.onclick=()=>{map.closePopup(p);beginMove(r)}},0)}
function drawAll(){layerDefs.forEach(([k])=>groups[k].clearLayers());polygonGroup.clearLayers();records.forEach(drawRecord);polygons.forEach(p=>{if(!p.deleted)p.layerObj=L.polygon(p.points,{pane:'polygon',color:'#5a8b5f',weight:3,fillColor:'#6ea979',fillOpacity:.09,interactive:false}).addTo(polygonGroup)});if(polygonVisible){if(!map.hasLayer(polygonGroup))polygonGroup.addTo(map)}else if(map.hasLayer(polygonGroup))map.removeLayer(polygonGroup);renderRecordCircles()}
function circleOpts(radius){if(radius===50)return{radius:50,color:'#d18a00',fillColor:'#d18a00',weight:2,fillOpacity:.07,renderer:circleRenderer,pane:'distance',interactive:false};if(radius===40)return{radius:40,color:'#8d62c1',fillColor:'#8d62c1',weight:2,dashArray:'6 5',fillOpacity:.055,renderer:circleRenderer,pane:'distance',interactive:false};return{radius:30,color:'#3e9b68',fillColor:'#3e9b68',weight:2,dashArray:'4 5',fillOpacity:.045,renderer:circleRenderer,pane:'distance',interactive:false}}
function renderRecordCircles(){recordCircleGroup.clearLayers();records.forEach(r=>{if(r.deleted||!map.hasLayer(groups[r.layer]))return;L.circle(r.latlng,circleOpts(50)).addTo(recordCircleGroup);circleExtras.forEach(radius=>L.circle(r.latlng,circleOpts(radius)).addTo(recordCircleGroup))})}
function snapshot(){try{localStorage.setItem(STORE,JSON.stringify({sourceName,records:records.map(({marker,...r})=>r),polygons:polygons.map(({layerObj,...p})=>p),activeLayer,circleMode,circleExtras,polygonVisible,center:[map.getCenter().lat,map.getCenter().lng],zoom:map.getZoom()}));resume.classList.add('show')}catch{}}setInterval(snapshot,2500);window.addEventListener('pagehide',snapshot);
function pushHistory(a){undoStack.push(a);redoStack.length=0;hist()}function hist(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length}hist();
function draftIcon(move=false){return L.divIcon({className:'preview-touch',html:`<div class="preview-dot${move?' move-aim':''}"></div>`,iconSize:[40,40],iconAnchor:[20,20]})}
function circlesAt(ll){return{c50:L.circle(ll,{radius:50,color:'#13b8d4',fillColor:'#13b8d4',weight:4,fillOpacity:.12,pane:'placement',interactive:false}),c40:L.circle(ll,{radius:40,color:'#5578ff',fillColor:'#5578ff',weight:3,dashArray:'7 5',fillOpacity:.08,pane:'placement',interactive:false})}}
function placementMode(){return'50'}
function updateDraftCircles(){if(!draft)return;[draft.c50,draft.c40].forEach(x=>map.removeLayer(x));draft.c50.addTo(map).bringToFront();draft.marker.setZIndexOffset(2400)}
