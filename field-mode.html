<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>現地モード | Campsite Design Tool JP</title>
  <link rel="stylesheet" href="css/style.css?v=90">
  <link rel="stylesheet" href="css/field-mode.css?v=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon.png">
</head>
<body class="field-mode-body">
  <header class="field-mode-header">
    <a href="lab.html" class="field-mode-back">← Campsite Lab</a>
    <div><div class="field-mode-eyebrow">FIELD POSITION ADJUSTMENT</div><h1>現地モード</h1></div>
    <div id="fieldModeStatus" class="field-mode-status" aria-live="polite">準備中</div>
  </header>

  <main class="field-mode-main">
    <section class="field-mode-intro">
      <strong>事前に配置した追加予定POIを、現地で実際の位置へ合わせます。</strong>
      <p>基本は「作る」ではなく「合わせる」。新規POI追加は補助機能として扱います。</p>
      <label style="display:block;margin-top:10px;font-size:12px;font-weight:800;">現地確認するKMZ / KML
        <input id="fieldModeFile" type="file" accept=".kmz,.kml,.zip" style="display:block;width:100%;margin-top:6px;">
      </label>
      <div id="fieldModeFileStatus" style="margin-top:6px;font-size:11px;color:#746957;">ファイルを選択してください。</div>
    </section>

    <section class="field-mode-stage" aria-label="現地モード地図領域">
      <div id="fieldModeMap" style="position:absolute;inset:0;z-index:1;"></div>
      <div id="fieldModePlaceholder" class="field-mode-placeholder" style="z-index:2;pointer-events:none;">
        <span class="field-mode-placeholder-icon">⌖</span>
        <strong>KMZを読み込むと、ここに現地確認用マップを表示します。</strong>
        <span>既存POI・追加予定POIを重ねて確認します。</span>
      </div>
      <button type="button" class="field-mode-new-poi" style="z-index:500;" disabled>＋ 新規</button>
    </section>

    <section class="field-mode-selection" aria-live="polite">
      <div class="field-mode-selection-title">追加予定POIを選択してください</div>
      <div class="field-mode-selection-detail">選択後、「現在地へ再配置」または「位置を微調整」を使います。</div>
      <div class="field-mode-adjust-actions"><button type="button" disabled>現在地へ再配置</button><button type="button" disabled>位置を微調整</button></div>
    </section>
  </main>

  <nav class="field-mode-toolbar" aria-label="現地モード操作">
    <button type="button" class="field-mode-history-button" disabled>← 戻る</button>
    <button type="button" class="field-mode-scan-button" disabled aria-label="SCAN"><span class="field-mode-scan-ring"></span><span>SCAN</span></button>
    <button type="button" class="field-mode-history-button" disabled>進む →</button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const fileInput = document.getElementById('fieldModeFile');
    const fileStatus = document.getElementById('fieldModeFileStatus');
    const modeStatus = document.getElementById('fieldModeStatus');
    const placeholder = document.getElementById('fieldModePlaceholder');
    const map = L.map('fieldModeMap', { zoomControl: true }).setView([35.6812, 139.7671], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    let dataLayer = L.layerGroup().addTo(map);

    function directChildrenByTag(node, tag) {
      return Array.from(node.children || []).filter(el => el.localName === tag);
    }

    function textOf(node, tag) {
      const el = Array.from(node.children || []).find(child => child.localName === tag);
      return el ? (el.textContent || '').trim() : '';
    }

    function folderNameFor(placemark) {
      let node = placemark.parentElement;
      while (node) {
        if (node.localName === 'Folder') return textOf(node, 'name');
        node = node.parentElement;
      }
      return '';
    }

    function parseCoordList(text) {
      return text.trim().split(/\s+/).map(item => {
        const parts = item.split(',').map(Number);
        return [parts[1], parts[0]];
      }).filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    }

    function isAddedPoi(folder, name) {
      return /追加|追加予定|add|planned|candidate/i.test(`${folder} ${name}`);
    }

    function renderKml(kmlText) {
      const xml = new DOMParser().parseFromString(kmlText, 'application/xml');
      if (xml.querySelector('parsererror')) throw new Error('KMLを解析できませんでした。');
      dataLayer.clearLayers();
      const bounds = [];
      const placemarks = Array.from(xml.getElementsByTagNameNS('*', 'Placemark'));

      placemarks.forEach(pm => {
        const name = textOf(pm, 'name') || '名称なし';
        const folder = folderNameFor(pm);
        const point = pm.getElementsByTagNameNS('*', 'Point')[0];
        const line = pm.getElementsByTagNameNS('*', 'LineString')[0];
        const polygon = pm.getElementsByTagNameNS('*', 'Polygon')[0];

        if (point) {
          const c = point.getElementsByTagNameNS('*', 'coordinates')[0];
          if (!c) return;
          const pts = parseCoordList(c.textContent);
          if (!pts.length) return;
          const latlng = pts[0];
          const added = isAddedPoi(folder, name);
          const marker = L.circleMarker(latlng, { radius: added ? 9 : 7, weight: 3, color: added ? '#d58b00' : '#375f87', fillColor: added ? '#ffd35c' : '#78b9ed', fillOpacity: .9 });
          marker.bindPopup(`<strong>${name}</strong>${folder ? `<br><small>${folder}</small>` : ''}${added ? '<br><b>追加予定POI</b>' : ''}`);
          marker.addTo(dataLayer);
          bounds.push(latlng);
          return;
        }

        const geometry = line || polygon;
        if (!geometry) return;
        const coordNodes = Array.from(geometry.getElementsByTagNameNS('*', 'coordinates'));
        coordNodes.forEach(c => {
          const pts = parseCoordList(c.textContent);
          if (pts.length < 2) return;
          const shape = polygon ? L.polygon(pts, { color:'#8b6a2f', weight:2, fillOpacity:.08 }) : L.polyline(pts, { color:'#8b6a2f', weight:3 });
          shape.bindPopup(`<strong>${name}</strong>${folder ? `<br><small>${folder}</small>` : ''}`).addTo(dataLayer);
          bounds.push(...pts);
        });
      });

      if (!bounds.length) throw new Error('表示できる地点・線・範囲が見つかりませんでした。');
      map.fitBounds(bounds, { padding:[24,24], maxZoom:18 });
      placeholder.style.display = 'none';
      modeStatus.textContent = 'KMZ読込済';
      fileStatus.textContent += ` ／ ${placemarks.length}件を読み込み`;
      setTimeout(() => map.invalidateSize(), 50);
    }

    async function readKmlText(file) {
      const lower = file.name.toLowerCase();
      if (lower.endsWith('.kml')) return await file.text();
      if (!window.JSZip) throw new Error('KMZ展開ライブラリを読み込めませんでした。');
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const names = Object.keys(zip.files).filter(n => n.toLowerCase().endsWith('.kml') && !zip.files[n].dir);
      if (!names.length) throw new Error('KMZ内にKMLがありません。');
      const preferred = names.find(n => /(^|\/)doc\.kml$/i.test(n)) || names[0];
      return await zip.files[preferred].async('string');
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      fileStatus.textContent = `読込中：${file.name}`;
      modeStatus.textContent = '読込中';
      try {
        const kmlText = await readKmlText(file);
        fileStatus.textContent = `選択中：${file.name}`;
        renderKml(kmlText);
      } catch (error) {
        console.error(error);
        dataLayer.clearLayers();
        placeholder.style.display = '';
        modeStatus.textContent = '読込失敗';
        fileStatus.textContent = `⚠ ${error.message || 'ファイルを読み込めませんでした。'}`;
      }
    });
  </script>
</body>
</html>
