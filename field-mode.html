<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">

  <style>
    .field-distance-badge.near{background:rgba(255,251,230,.97);border-color:#d2aa36;color:#715b12}.field-distance-badge.caution{background:rgba(255,243,216,.98);border-color:#dc881f;color:#815000}.field-distance-badge.danger{background:rgba(255,235,231,.98);border-color:#d9534f;color:#9b2926}
    .field-crosshair{position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);z-index:560;pointer-events:none;display:none}.field-crosshair::before,.field-crosshair::after{content:"";position:absolute;background:#7b4d00;box-shadow:0 0 0 2px rgba(255,255,255,.85)}.field-crosshair::before{width:2px;height:42px;left:20px;top:0}.field-crosshair::after{height:2px;width:42px;left:0;top:20px}.field-crosshair-dot{position:absolute;width:10px;height:10px;border:3px solid #7b4d00;border-radius:50%;left:16px;top:16px;background:#fff}
    .field-scan-pulse{animation:fieldPulse .9s ease-out}@keyframes fieldPulse{0%{stroke-width:8;fill-opacity:.18}100%{stroke-width:1;fill-opacity:0}}.field-mode-adjust-actions button:not(:disabled){background:#d8b766;color:#3b2d15;border-color:#9b742b}
    .field-save-row{margin-top:10px}.field-save-button{width:100%;border:1px solid #8a6b31;border-radius:14px;padding:12px;background:#fff8e6;color:#49391e;font-weight:900;font-size:14px}.field-save-button:disabled{opacity:.42}.field-save-note{margin-top:6px;font-size:11px;color:#746957;text-align:center}
  </style>
</head>
<body class="field-mode-body">
<header class="field-mode-header"><a href="lab.html" class="field-mode-back">← Campsite Lab</a><div><div class="field-mode-eyebrow">FIELD POSITION ADJUSTMENT</div><h1>現地モード</h1></div><div id="fieldModeStatus" class="field-mode-status" aria-live="polite">準備中</div></header>
<main class="field-mode-main">
<section class="field-mode-intro"><strong>事前に配置した追加予定POIを、現地で実際の位置へ合わせます。</strong><p>基本は「作る」ではなく「合わせる」。新規POI追加は補助機能として扱います。</p><label style="display:block;margin-top:10px;font-size:12px;font-weight:800;">現地確認するKMZ / KML<input id="fieldModeFile" type="file" style="display:block;width:100%;margin-top:6px;"></label><div id="fieldModeFileStatus" style="margin-top:6px;font-size:11px;color:#746957;">KMZ / KML / ZIP を選択してください。</div></section>
<section class="field-mode-stage" aria-label="現地モード地図領域"><div id="fieldModeMap" style="position:absolute;inset:0;z-index:1;"></div><div id="fieldModePlaceholder" class="field-mode-placeholder" style="z-index:2;pointer-events:none;"><span class="field-mode-placeholder-icon">⌖</span><strong>KMZを読み込むと、ここに現地確認用マップを表示します。</strong><span>既存POI・追加予定POI・現在地を重ねて確認します。</span></div><div id="fieldModeCrosshair" class="field-crosshair"><span class="field-crosshair-dot"></span></div><div id="fieldModeDistanceBadge" class="field-distance-badge">● 判定待ち</div><div id="fieldModeLocationBadge" class="field-location-badge">GPS待機中</div><div id="fieldModePoiControls" class="field-mode-poi-controls" role="group" aria-label="新規POI操作"><button id="fieldModeNewPoiButton" type="button" class="field-mode-new-poi" disabled>＋ 新規</button></div></section>
<section class="field-mode-selection" aria-live="polite"><div id="fieldModeSelectionTitle" class="field-mode-selection-title">追加予定POIを選択してください</div><div id="fieldModeSelectionDetail" class="field-mode-selection-detail">地図上の黄色い追加予定POIをタップしてください。</div><div class="field-mode-adjust-actions"><button id="fieldModeRelocateButton" type="button" disabled>現在地へ再配置</button><button id="fieldModeFineTuneButton" type="button" disabled>位置を微調整</button></div><div class="field-save-row"><button id="fieldModeSaveButton" class="field-save-button" type="button" disabled>変更したPOIを端末へ保存</button><div id="fieldModeSaveNote" class="field-save-note">変更すると保存できるようになります。</div></div></section>
</main>
<nav class="field-mode-toolbar" aria-label="現地モード操作"><button id="fieldModeUndoButton" type="button" class="field-mode-history-button" disabled>← 戻る</button><button id="fieldModeScanButton" type="button" class="field-mode-scan-button" disabled aria-label="SCAN"><span class="field-mode-scan-ring"></span><span>SCAN</span></button><button id="fieldModeRedoButton" type="button" class="field-mode-history-button" disabled>進む →</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SPACING_POLICY=window.CampsitePoiSpacingPolicy,TARGET_DISTANCE=SPACING_POLICY.targetMeters;
const fileInput=document.getElementById('fieldModeFile'),fileStatus=document.getElementById('fieldModeFileStatus'),modeStatus=document.getElementById('fieldModeStatus'),placeholder=document.getElementById('fieldModePlaceholder');
const selectionTitle=document.getElementById('fieldModeSelectionTitle'),selectionDetail=document.getElementById('fieldModeSelectionDetail'),relocateButton=document.getElementById('fieldModeRelocateButton'),fineTuneButton=document.getElementById('fieldModeFineTuneButton'),saveButton=document.getElementById('fieldModeSaveButton'),saveNote=document.getElementById('fieldModeSaveNote'),newPoiButton=document.getElementById('fieldModeNewPoiButton');
const undoButton=document.getElementById('fieldModeUndoButton'),redoButton=document.getElementById('fieldModeRedoButton'),scanButton=document.getElementById('fieldModeScanButton'),crosshair=document.getElementById('fieldModeCrosshair'),locationBadge=document.getElementById('fieldModeLocationBadge'),distanceBadge=document.getElementById('fieldModeDistanceBadge');
const map=L.map('fieldModeMap',{zoomControl:true}).setView([35.6812,139.7671],15);map.attributionControl.setPosition('bottomleft');const fieldBaseMap=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const fieldAerialMap=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});L.control.layers({'地図':fieldBaseMap,'航空写真':fieldAerialMap},null,{position:'topright',collapsed:false}).addTo(map);map.createPane('fieldBackgroundPane');map.getPane('fieldBackgroundPane').style.zIndex=350;map.getPane('fieldBackgroundPane').style.pointerEvents='none';map.createPane('fieldPoiPane');map.getPane('fieldPoiPane').style.zIndex=450;map.createPane('fieldLocationPane');map.getPane('fieldLocationPane').style.zIndex=500;
let dataLayer=L.layerGroup().addTo(map),locationLayer=L.layerGroup().addTo(map),selectedPoi=null,currentPosition=null,currentAccuracy=null,locationMarker=null,accuracyCircle=null,fineTuneMode=false,poiRecords=[],sourceFileName='field-data',fileLoaded=false;const undoStack=[],redoStack=[];
function textOf(node,tag){const el=Array.from(node.children||[]).find(child=>child.localName===tag);return el?(el.textContent||'').trim():'';}function folderNameFor(pm){let node=pm.parentElement;while(node){if(node.localName==='Folder')return textOf(node,'name');node=node.parentElement;}return '';}function parseCoordList(text){return text.trim().split(/\s+/).map(item=>{const p=item.split(',').map(Number);return[p[1],p[0]];}).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));}function isAddedPoi(folder,name){return /追加|追加予定|追加希望|追加候補|候補|新設|add|planned|candidate|proposed/i.test(`${folder} ${name}`);}function meters(a,b){return map.distance(L.latLng(a[0],a[1]),L.latLng(b[0],b[1]));}
function changedRecords(){return poiRecords.filter(r=>r.added&&(r.isNew||meters(r.originalLatlng,r.latlng)>.05));}function updateSaveButton(){const n=changedRecords().length;saveButton.disabled=!n;saveButton.textContent=n?`変更したPOIを端末へ保存（${n}件）`:'変更したPOIを端末へ保存';saveNote.textContent=n?`${n}件の変更があります。`:'変更すると保存できるようになります。';}
function updateNewPoiButton(){newPoiButton.disabled=!fileLoaded;}
function nearestPoiByType(position,added,excludedRecord=null){let nearest=null;for(const record of poiRecords){if(record===excludedRecord||record.added!==added)continue;const d=meters(position,record.latlng);if(!nearest||d<nearest.distance)nearest={record,distance:d};}return nearest;}
function updateDistanceStatus(position=currentPosition,excludedRecord=null){distanceBadge.className='field-distance-badge';if(!position||!poiRecords.length){distanceBadge.textContent='● 判定待ち';distanceBadge.dataset.distanceBand='waiting';return;}const existing=nearestPoiByType(position,false,excludedRecord),planned=nearestPoiByType(position,true,excludedRecord),warnings=[];if(existing&&existing.distance<TARGET_DISTANCE)warnings.push({label:'既存POI',distance:existing.distance});if(planned&&planned.distance<TARGET_DISTANCE)warnings.push({label:'追加予定POI',distance:planned.distance});if(!warnings.length){distanceBadge.textContent=`● ${TARGET_DISTANCE}m以上を確保`;distanceBadge.dataset.distanceBand='ok';return;}const nearest=Math.min(...warnings.map(item=>item.distance)),band=SPACING_POLICY.distanceBand(nearest);distanceBadge.dataset.distanceBand=band;if(band!=='ok'&&band!=='waiting')distanceBadge.classList.add(band);distanceBadge.innerHTML=warnings.sort((a,b)=>a.distance-b.distance).map(item=>`⚠ ${TARGET_DISTANCE}m未満：${item.label}まで ${item.distance.toFixed(1)}m`).join('<br>');}
function updateHistoryButtons(){undoButton.disabled=!undoStack.length;redoButton.disabled=!redoStack.length;}function pushMove(record,from,to){undoStack.push({kind:'move',record,from:[...from],to:[...to]});redoStack.length=0;updateHistoryButtons();}function applyMove(record,latlng){record.latlng=[...latlng];record.marker.setLatLng(record.latlng);if(record.rangeCircle)record.rangeCircle.setLatLng(record.latlng);updateSaveButton();if(selectedPoi===record)refreshSelectionPanel();else updateDistanceStatus(record.latlng,record);}
function refreshSelectionPanel(){if(!selectedPoi)return;selectionTitle.textContent=`選択中：${selectedPoi.name}`;let detail=selectedPoi.folder||'追加予定POI';if(currentPosition)detail+=` ／ 現在地から ${meters(selectedPoi.latlng,currentPosition).toFixed(1)}m`;selectionDetail.textContent=detail;relocateButton.disabled=!currentPosition||fineTuneMode;fineTuneButton.disabled=false;if(fineTuneMode){const c=map.getCenter();updateDistanceStatus([c.lat,c.lng],selectedPoi);}else updateDistanceStatus(selectedPoi.latlng,selectedPoi);}
function resetPoiSelection(){if(selectedPoi?.marker)selectedPoi.marker.setStyle({radius:9,weight:3,color:'#d58b00',fillColor:'#ffd35c',fillOpacity:.9});selectedPoi=null;fineTuneMode=false;crosshair.style.display='none';relocateButton.textContent='現在地へ再配置';fineTuneButton.textContent='位置を微調整';selectionTitle.textContent='追加予定POIを選択してください';selectionDetail.textContent='地図上の黄色い追加予定POIをタップしてください。';relocateButton.disabled=true;fineTuneButton.disabled=true;updateDistanceStatus(currentPosition);}
function selectAddedPoi(record){if(selectedPoi?.marker&&selectedPoi.marker!==record.marker)selectedPoi.marker.setStyle({radius:9,weight:3,color:'#d58b00',fillColor:'#ffd35c',fillOpacity:.9});selectedPoi=record;record.marker.setStyle({radius:13,weight:5,color:'#5d3f00',fillColor:'#fff19a',fillOpacity:1});record.marker.bringToFront();refreshSelectionPanel();}
function setCurrentPosition(lat,lng,accuracy,recenter=false){currentPosition=[lat,lng];currentAccuracy=accuracy;if(!locationMarker){locationMarker=L.circleMarker(currentPosition,{pane:'fieldLocationPane',radius:8,weight:3,color:'#fff',fillColor:'#1687e8',fillOpacity:1,interactive:false}).addTo(locationLayer);accuracyCircle=L.circle(currentPosition,{pane:'fieldBackgroundPane',radius:accuracy||0,color:'#1687e8',weight:1,fillColor:'#1687e8',fillOpacity:.08,interactive:false}).addTo(locationLayer);}else{locationMarker.setLatLng(currentPosition);accuracyCircle.setLatLng(currentPosition).setRadius(accuracy||0);}const accuracyText=Number.isFinite(accuracy)?`±${Math.round(accuracy)}m`:'精度不明';locationBadge.textContent=`● 現在地 ${accuracyText}`;modeStatus.textContent=Number.isFinite(accuracy)&&accuracy>25?'GPS精度低め':'GPS取得済';scanButton.disabled=false;updateNewPoiButton();if(fineTuneMode&&selectedPoi){const c=map.getCenter();updateDistanceStatus([c.lat,c.lng],selectedPoi);}else if(selectedPoi)refreshSelectionPanel();else updateDistanceStatus(currentPosition);if(recenter&&!fineTuneMode)map.panTo(currentPosition);}
function onGeoSuccess(pos,recenter=false){setCurrentPosition(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy,recenter);}function onGeoError(){locationBadge.textContent='⚠ 位置情報を取得できません';modeStatus.textContent='GPS未取得';updateNewPoiButton();}function startGps(){if(!navigator.geolocation){onGeoError();return;}navigator.geolocation.watchPosition(p=>onGeoSuccess(p,false),onGeoError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});}function scanNow(){if(!navigator.geolocation)return;modeStatus.textContent='SCAN中';navigator.geolocation.getCurrentPosition(pos=>{onGeoSuccess(pos,true);const pulse=L.circle(currentPosition,{pane:'fieldLocationPane',radius:TARGET_DISTANCE,color:'#1687e8',weight:4,fillColor:'#1687e8',fillOpacity:.12,interactive:false,className:'field-scan-pulse'}).addTo(locationLayer);setTimeout(()=>locationLayer.removeLayer(pulse),950);modeStatus.textContent='SCAN完了';},onGeoError,{enableHighAccuracy:true,maximumAge:0,timeout:15000});}
function makeNewPoi(){if(!fileLoaded)return;const count=poiRecords.filter(r=>r.isNew).length+1;const name=window.prompt('新規POIの名前を入力してください',`新規POI ${count}`);if(name===null)return;const trimmed=name.trim()||`新規POI ${count}`;const description=window.prompt('説明を入力してください（空欄でもOK）','');if(description===null)return;const center=map.getCenter();const latlng=[center.lat,center.lng];const rangeCircle=L.circle(latlng,{pane:'fieldBackgroundPane',radius:TARGET_DISTANCE,color:'#d58b00',weight:2,opacity:.7,fillColor:'#ffd35c',fillOpacity:.035,interactive:false,dashArray:'6 5'}).addTo(dataLayer);const marker=L.circleMarker(latlng,{pane:'fieldPoiPane',radius:9,weight:3,color:'#d58b00',fillColor:'#ffd35c',fillOpacity:.9}).addTo(dataLayer);const record={marker,rangeCircle,name:trimmed,description:description.trim(),folder:'追加希望POI',latlng:[...latlng],originalLatlng:[...latlng],added:true,isNew:true,include30mCircle:false,include40mCircle:false,fieldMemo:'',fieldMemoDirty:false,fieldPhoto:null,fieldPhotoDirty:false};poiRecords.push(record);marker.bindPopup(`<strong>${trimmed}</strong><br><small>追加希望POI</small><br><b>新規追加POI</b>`);marker.on('click',()=>selectAddedPoi(record));undoStack.push({kind:'add',record});redoStack.length=0;updateHistoryButtons();updateSaveButton();selectAddedPoi(record);updateDistanceStatus(record.latlng,record);modeStatus.textContent='新規POI追加';}
newPoiButton.addEventListener('click',makeNewPoi);
relocateButton.addEventListener('click',()=>{if(!selectedPoi||!currentPosition)return;const from=[...selectedPoi.latlng],to=[...currentPosition];pushMove(selectedPoi,from,to);applyMove(selectedPoi,to);selectionDetail.textContent+=' ／ 現在地へ再配置しました';});fineTuneButton.addEventListener('click',()=>{if(!selectedPoi)return;if(!fineTuneMode){fineTuneMode=true;crosshair.style.display='block';map.panTo(selectedPoi.latlng);relocateButton.textContent='この位置に変更';relocateButton.disabled=false;fineTuneButton.textContent='微調整を取消';selectionDetail.textContent='地図を動かし、中央の照準へ位置を合わせてください。';const c=map.getCenter();updateDistanceStatus([c.lat,c.lng],selectedPoi);}else{fineTuneMode=false;crosshair.style.display='none';relocateButton.textContent='現在地へ再配置';fineTuneButton.textContent='位置を微調整';refreshSelectionPanel();}});function updateFineTuneDistance(){if(!fineTuneMode||!selectedPoi)return;const c=map.getCenter();updateDistanceStatus([c.lat,c.lng],selectedPoi);}map.on('move',updateFineTuneDistance);map.on('moveend',updateFineTuneDistance);relocateButton.addEventListener('click',(e)=>{if(!fineTuneMode||!selectedPoi)return;e.stopImmediatePropagation();const center=map.getCenter(),from=[...selectedPoi.latlng],to=[center.lat,center.lng];pushMove(selectedPoi,from,to);applyMove(selectedPoi,to);fineTuneMode=false;crosshair.style.display='none';relocateButton.textContent='現在地へ再配置';fineTuneButton.textContent='位置を微調整';refreshSelectionPanel();selectionDetail.textContent+=' ／ 微調整しました';},true);
undoButton.addEventListener('click',()=>{const a=undoStack.pop();if(!a)return;if(a.kind==='add'){dataLayer.removeLayer(a.record.marker);if(a.record.rangeCircle)dataLayer.removeLayer(a.record.rangeCircle);const i=poiRecords.indexOf(a.record);if(i>=0)poiRecords.splice(i,1);if(selectedPoi===a.record)resetPoiSelection();redoStack.push(a);}else{applyMove(a.record,a.from);redoStack.push(a);}updateHistoryButtons();updateSaveButton();});
redoButton.addEventListener('click',()=>{const a=redoStack.pop();if(!a)return;if(a.kind==='add'){poiRecords.push(a.record);a.record.marker.addTo(dataLayer);if(a.record.rangeCircle)a.record.rangeCircle.addTo(dataLayer);undoStack.push(a);selectAddedPoi(a.record);}else{applyMove(a.record,a.to);undoStack.push(a);}updateHistoryButtons();updateSaveButton();});scanButton.addEventListener('click',scanNow);
function xmlEscape(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}function exportChangedPois(){const changed=changedRecords();if(!changed.length)return;}
function renderKml(kmlText){const xml=new DOMParser().parseFromString(kmlText,'application/xml');if(xml.querySelector('parsererror'))throw new Error('KMLを解析できませんでした。');dataLayer.clearLayers();poiRecords=[];undoStack.length=0;redoStack.length=0;updateHistoryButtons();resetPoiSelection();const bounds=[],placemarks=Array.from(xml.getElementsByTagNameNS('*','Placemark'));placemarks.forEach(pm=>{const name=textOf(pm,'name')||'名称なし',folder=folderNameFor(pm),point=pm.getElementsByTagNameNS('*','Point')[0],line=pm.getElementsByTagNameNS('*','LineString')[0],polygon=pm.getElementsByTagNameNS('*','Polygon')[0];if(point){const c=point.getElementsByTagNameNS('*','coordinates')[0];if(!c)return;const pts=parseCoordList(c.textContent);if(!pts.length)return;const latlng=pts[0],added=isAddedPoi(folder,name);const rangeCircle=L.circle(latlng,{pane:'fieldBackgroundPane',radius:TARGET_DISTANCE,color:added?'#d58b00':'#375f87',weight:2,opacity:.7,fillColor:added?'#ffd35c':'#78b9ed',fillOpacity:.035,interactive:false,dashArray:added?'6 5':null}).addTo(dataLayer);const marker=L.circleMarker(latlng,{pane:'fieldPoiPane',radius:added?9:7,weight:3,color:added?'#d58b00':'#375f87',fillColor:added?'#ffd35c':'#78b9ed',fillOpacity:.9});const record={marker,rangeCircle,name,description:textOf(pm,'description'),folder,latlng:[...latlng],originalLatlng:[...latlng],added,isNew:false,include30mCircle:false,include40mCircle:false,fieldMemo:'',fieldMemoDirty:false,fieldPhoto:null,fieldPhotoDirty:false};poiRecords.push(record);marker.bindPopup(`<strong>${name}</strong>${folder?`<br><small>${folder}</small>`:''}${added?'<br><b>追加予定POI</b>':''}<br><small>現地モード：${TARGET_DISTANCE}m円を自動表示</small>`);if(added)marker.on('click',()=>selectAddedPoi(record));marker.addTo(dataLayer);bounds.push(latlng);return;}const geometry=line||polygon;if(!geometry)return;Array.from(geometry.getElementsByTagNameNS('*','coordinates')).forEach(c=>{const pts=parseCoordList(c.textContent);if(pts.length<2)return;const common={pane:'fieldBackgroundPane',interactive:false,bubblingMouseEvents:false},shape=polygon?L.polygon(pts,{...common,color:'#8b6a2f',weight:2,fillOpacity:.05}):L.polyline(pts,{...common,color:'#8b6a2f',weight:2,opacity:.55});shape.addTo(dataLayer);bounds.push(...pts);});});if(!bounds.length)throw new Error('表示できる地点・線・範囲が見つかりませんでした。');map.fitBounds(bounds,{padding:[24,24],maxZoom:18});placeholder.style.display='none';fileLoaded=true;updateNewPoiButton();modeStatus.textContent=currentPosition?'GPS取得済':'KMZ読込済';fileStatus.textContent+=` ／ ${placemarks.length}件を読み込み ／ ${TARGET_DISTANCE}m円を自動表示`;updateSaveButton();updateDistanceStatus(currentPosition);setTimeout(()=>map.invalidateSize(),50);}
async function readKmlText(file){const lower=file.name.toLowerCase();if(!/\.(kml|kmz|zip)$/.test(lower))throw new Error('KMZ / KML / ZIP ファイルを選択してください。');if(lower.endsWith('.kml'))return await file.text();if(!window.JSZip)throw new Error('KMZ展開ライブラリを読み込めませんでした。');const zip=await JSZip.loadAsync(await file.arrayBuffer()),names=Object.keys(zip.files).filter(n=>n.toLowerCase().endsWith('.kml')&&!zip.files[n].dir);if(!names.length)throw new Error('KMZ内にKMLがありません。');const preferred=names.find(n=>/(^|\/)doc\.kml$/i.test(n))||names[0];return await zip.files[preferred].async('string');}
fileInput.addEventListener('change',async()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;fileLoaded=false;updateNewPoiButton();sourceFileName=file.name;fileStatus.textContent=`読込中：${file.name}`;modeStatus.textContent='読込中';try{const kmlText=await readKmlText(file);fileStatus.textContent=`選択中：${file.name}`;renderKml(kmlText);}catch(error){console.error(error);dataLayer.clearLayers();resetPoiSelection();placeholder.style.display='';modeStatus.textContent='読込失敗';fileStatus.textContent=`⚠ ${error.message||'ファイルを読み込めませんでした。'}`;}});updateSaveButton();updateNewPoiButton();startGps();
</script>
