name: Temporary distance manual reference

on:
  push:
    branches:
      - agent/ui-overhaul-03-distance-input

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run distance manual reference patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-overhaul-03-distance-input

      - name: Update manual page reference
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('js/distance-entry.js')
          js = js_path.read_text(encoding='utf-8')

          old = '''      <a
        href="docs/campsite-guide.pdf"
        target="_blank"
        rel="noopener"
      >
        書き出し方法を確認
      </a>'''

          new = '''      <a
        href="docs/campsite-guide.pdf#page=12"
        target="_blank"
        rel="noopener"
      >
        書き出し方法を確認<br>
        <small>マニュアル12P「5-5」を参照</small>
      </a>'''

          if old not in js:
              raise SystemExit('Expected manual link block not found')

          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = 'js/distance-entry.js?v=1'
          new_version = 'js/distance-entry.js?v=2'

          if old_version not in index:
              raise SystemExit('Expected distance-entry cache version not found')

          index_path.write_text(
              index.replace(old_version, new_version, 1),
              encoding='utf-8'
          )
          PY

          rm .github/workflows/temp-distance-manual-reference.yml
          rm .tmp-distance-manual-reference-trigger

      - name: Commit manual reference update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Point distance guide to manual page 12'
          git push origin HEAD:agent/ui-overhaul-03-distance-input
