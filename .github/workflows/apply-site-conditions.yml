name: Apply approved site-condition labels

on:
  push:
    branches:
      - agent/ui-overhaul-04-site-conditions

permissions:
  contents: write

jobs:
  apply-labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-overhaul-04-site-conditions
          fetch-depth: 0

      - name: Apply approved display-only changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("index.html"): [
                  (
                      '<div class="step-no">CA所感</div>',
                      '<div class="step-no">現地環境チェック</div>',
                  ),
                  (
                      '<p class="note">現地の状況を選択してください。</p>',
                      '<p class="note">現地の通行・広場・回遊・待機環境を確認してください。</p>',
                  ),
              ],
              Path("js/distance.js"): [
                  (
                      '<strong>CA所感</strong><br>',
                      '<strong>現地環境チェック</strong><br>',
                  ),
              ],
          }

          for path, items in replacements.items():
              data = path.read_bytes()

              for old, new in items:
                  old_bytes = old.encode("utf-8")
                  new_bytes = new.encode("utf-8")
                  count = data.count(old_bytes)

                  if count != 1:
                      raise SystemExit(
                          f"Expected exactly one match in {path}: {old!r}; found {count}"
                      )

                  data = data.replace(old_bytes, new_bytes, 1)

              path.write_bytes(data)
          PY

          rm .github/workflows/apply-site-conditions.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html js/distance.js .github/workflows/apply-site-conditions.yml
          git diff --cached --check
          git commit -m "Rename CA observations to site conditions"
          git push origin HEAD:agent/ui-overhaul-04-site-conditions
