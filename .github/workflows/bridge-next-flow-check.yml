name: Bridge Next Flow Check

on:
  pull_request:
    paths:
      - 'bridge-gateway.html'
      - 'bridge-receiver.html'
      - 'bridge-next-preview.html'
      - 'index.html'
      - 'js/ca-access.js'
      - 'js/ca-access-bootstrap.js'
      - 'js/lab-supabase.js'
      - 'js/poi-spacing-config.js'
      - 'bridge-distance.html'
      - 'bridge-next-preview.html'
      - 'js/bridge-next-flow.js'
      - 'js/bridge-distance-project.js'
      - 'creative/bridge.html'
      - 'creative/index.html'
      - 'creative/rain-dev.html'
      - 'creative/bridge-project-patch.js'
      - 'scripts/check-bridge-next-flow.mjs'
      - '.github/workflows/bridge-next-flow-check.yml'
  workflow_dispatch:

jobs:
  bridge-next-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contract check
        run: node scripts/check-bridge-next-flow.mjs

      - name: Syntax check
        run: |
          node --check js/bridge-next-flow.js
          node --check creative/bridge-project-patch.js
          node --check js/ca-access.js
          node --check js/ca-access-bootstrap.js
          node --check js/bridge-distance-project.js
