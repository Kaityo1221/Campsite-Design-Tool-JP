name: Bridge Next Flow Check

on:
  pull_request:
    paths:
      - 'bridge-gateway.html'
      - 'bridge-receiver.html'
      - 'bridge-next-preview.html'
      - 'index.html'
      - 'js/ca-access.js'
      - 'js/ca-access-bootstrap.js'
      - 'js/lab-supabase.js'
      - 'js/poi-spacing-config.js'
      - 'bridge-distance.html'
      - 'bridge-next-preview.html'
      - 'js/bridge-next-flow.js'
      - 'js/bridge-selection.js'
      - 'docs/bridge-project-contract-v1.md'
      - 'docs/bridge-pc-minimum-spec-v1.md'
      - 'js/bridge-distance-project.js'
      - 'creative/bridge.html'
      - 'creative/index.html'
      - 'creative/base-v7.html'
      - 'creative/runtime/**'
      - 'creative/rain-dev.html'
      - 'creative/bridge-project-patch.js'
      - 'creative/jp-creative-patch.js'
      - 'scripts/check-bridge-next-flow.mjs'
      - 'scripts/check-bridge-three-device-e2e.mjs'
      - 'scripts/check-creative-project-recovery.mjs'
      - 'scripts/check-pc-bridge-spec.mjs'
      - 'scripts/check-creative-runtime-build.mjs'
      - '.github/workflows/bridge-next-flow-check.yml'
  workflow_dispatch:

jobs:
  bridge-next-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contract check
        run: |
          node scripts/check-bridge-next-flow.mjs
          node scripts/check-bridge-three-device-e2e.mjs
          node scripts/check-creative-project-recovery.mjs
          node scripts/check-pc-bridge-spec.mjs
          node scripts/check-creative-runtime-build.mjs

      - name: Syntax check
        run: |
          node --check scripts/check-bridge-three-device-e2e.mjs
          node --check js/bridge-next-flow.js
          node --check js/bridge-selection.js
          node --check creative/bridge-project-patch.js
          node --check js/ca-access.js
          node --check js/ca-access-bootstrap.js
          node --check js/bridge-distance-project.js
