name: Issue 51 wire admin session auth

on:
  push:
    branches:
      - agent/post-overhaul-65-admin-review-knowledge
    paths:
      - .github/workflows/issue51-wire-admin-session.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-overhaul-65-admin-review-knowledge

      - name: Patch admin authentication wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('js/main.js')
          text = main.read_text()
          text = text.replace('const ADMIN_CODE = "she1ep";\n', '')

          pattern = re.compile(
              r'function openAdminLogin\(\) \{.*?\n\}\n\nfunction closeAdminLogin\(\) \{.*?\n\}\n\nfunction checkAdminCode\(\) \{.*?\n\}\n(?=document\.addEventListener\("DOMContentLoaded")',
              re.S,
          )
          replacement = '''function openAdminLogin() {
            if (window.CampsiteAdminAuth?.openAdminEntry) {
              return window.CampsiteAdminAuth.openAdminEntry();
            }
            alert("管理者認証を準備中です。少し待ってから再度お試しください。");
          }

          function closeAdminLogin() {
            const modal = document.getElementById("adminLoginModal");
            if (modal) modal.style.display = "none";
          }

          function checkAdminCode() {
            if (window.CampsiteAdminAuth?.loginFromModal) {
              return window.CampsiteAdminAuth.loginFromModal();
            }

            const error = document.getElementById("adminLoginError");
            if (error) error.textContent = "管理者認証を準備中です";
          }
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'admin auth block replacement failed: {count}')
          main.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          marker = '<script src="js/lab-supabase.js?v=1"></script>'
          auth = '<script src="js/admin-auth.js?v=1"></script>'
          if auth not in html:
              html = html.replace(marker, marker + '\n' + auth)
          html = html.replace(
              '<script src="js/admin-kmz-browser.js?v=1"></script>',
              '<script src="js/admin-kmz-browser.js?v=2"></script>'
          )
          index.write_text(html)

          browser = Path('js/admin-kmz-browser.js')
          js = browser.read_text()
          js = js.replace('const FUNCTION_NAME = "admin-kmz-browser";', 'const FUNCTION_NAME = "admin-kmz-access";')
          js = js.replace('  let adminCode = "";\n', '')

          old_invoke = '''  async function invokeFunction(body) {
            if (!window.campsiteSupabase?.functions) {
              throw new Error("Supabaseクライアントを初期化できませんでした。");
            }

            if (!adminCode) {
              throw new Error("管理者認証が必要です。");
            }

            const { data, error } = await window.campsiteSupabase.functions.invoke(
              FUNCTION_NAME,
              { body: { ...body, adminCode } }
            );

            if (error) throw error;
            if (!data?.success) {
              const exception = new Error(data?.error || "管理者KMZブラウザの処理に失敗しました。");
              exception.authRequired = data?.authRequired === true;
              throw exception;
            }

            return data;
          }
          '''
          new_invoke = '''  async function invokeFunction(body) {
            if (!window.campsiteSupabase?.functions) {
              throw new Error("Supabaseクライアントを初期化できませんでした。");
            }

            const sessionToken = window.CampsiteAdminAuth?.getSessionToken?.() || "";
            if (!sessionToken) {
              throw new Error("管理者認証が必要です。");
            }

            const { data, error } = await window.campsiteSupabase.functions.invoke(
              FUNCTION_NAME,
              { body: { ...body, sessionToken } }
            );

            if (error) {
              let message = error.message || "管理者KMZブラウザの処理に失敗しました。";
              let details = null;
              try {
                if (error.context && typeof error.context.json === "function") {
                  details = await error.context.json();
                  if (details?.error) message = details.error;
                }
              } catch (_) {}

              const exception = new Error(message);
              exception.authRequired = details?.authRequired === true;
              throw exception;
            }

            if (!data?.success) {
              const exception = new Error(data?.error || "管理者KMZブラウザの処理に失敗しました。");
              exception.authRequired = data?.authRequired === true;
              throw exception;
            }

            return data;
          }
          '''
          if old_invoke not in js:
              raise SystemExit('invokeFunction block not found')
          js = js.replace(old_invoke, new_invoke)

          js = js.replace(
              '''    if (!adminCode) {
                renderLocked();
                return;
              }
          ''',
              '''    if (!window.CampsiteAdminAuth?.isUnlocked?.()) {
                renderLocked();
                return;
              }
          ''',
              1,
          )

          js = js.replace(
              '''      if (error?.authRequired || /認証/.test(error?.message || "")) {
                adminCode = "";
                renderLocked();
              } else {
          ''',
              '''      if (error?.authRequired || /認証/.test(error?.message || "")) {
                window.CampsiteAdminAuth?.clearSession?.();
                renderLocked();
              } else {
          ''',
              1,
          )

          tail_pattern = re.compile(
              r'  function unlock\(code\) \{.*?\n  window\.AdminKmzBrowser = Object\.freeze\(\{.*?\n  \}\);',
              re.S,
          )
          tail_replacement = '''  function onAuthenticated() {
            payload = null;
            ensureBrowserUi();
            return loadRecords(true);
          }

          function setup() {
            ensureStyles();
            ensureBrowserUi();

            if (window.CampsiteAdminAuth?.isUnlocked?.()) {
              loadRecords(false);
            } else {
              renderLocked();
            }
          }

          window.AdminKmzBrowser = Object.freeze({
            onAuthenticated,
            reload: () => loadRecords(true),
            open: () => {
              ensureBrowserUi();
              return loadRecords(false);
            }
          });'''
          js, tail_count = tail_pattern.subn(tail_replacement, js, count=1)
          if tail_count != 1:
              raise SystemExit(f'admin browser tail replacement failed: {tail_count}')

          browser.write_text(js)
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js js/admin-kmz-browser.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move admin login to server-side session auth"
          git push origin HEAD:agent/post-overhaul-65-admin-review-knowledge

# retrigger
