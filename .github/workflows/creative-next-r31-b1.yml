name: Creative Next r31 B1 POI gates
on:
  push:
    branches: [codex/original-ui-r31]
    paths:
      - 'creative-next/original-ui-r31-b1/**'
      - 'creative-next/qa/r31-b1/**'
      - '.github/workflows/creative-next-r31-b1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b1:
    if: github.ref == 'refs/heads/codex/original-ui-r31'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated QA dependencies
        run: npm install --prefix creative-next --no-save --no-package-lock --ignore-scripts jszip@3.10.1 @xmldom/xmldom@0.9.8 acorn@8.15.0 leaflet@1.9.4 pngjs@7.0.0 playwright@1.56.0
      - name: Install Chromium
        run: creative-next/node_modules/.bin/playwright install --with-deps chromium
      - name: B1 real POI flow and frozen Part A UI regressions
        run: node creative-next/qa/r31-b1/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-b1-synthetic-evidence
          path: |
            creative-next/qa/r31-b1/*.json
            creative-next/qa/r31-b1/*.log
# No deploy, storage, import UI, or B2/B3/B4 jobs.
