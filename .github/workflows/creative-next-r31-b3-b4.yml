name: Creative Next r31 B3 B4 safety and regression
on:
  push:
    branches: [codex/original-ui-r31-b3-b4]
    paths:
      - 'creative-next/original-ui-r31-b3-b4/**'
      - 'creative-next/qa/r31-b3-b4/**'
      - '.github/workflows/creative-next-r31-b3-b4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    if: github.ref == 'refs/heads/codex/original-ui-r31-b3-b4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed isolated QA dependencies
        run: npm install --prefix creative-next --no-save --no-package-lock --ignore-scripts jszip@3.10.1 @xmldom/xmldom@0.9.8 acorn@8.15.0 leaflet@1.9.4 pngjs@7.0.0 playwright@1.56.0
      - name: Install Chromium
        run: creative-next/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify generated presentation is current
        run: |
          node creative-next/qa/r31-b3-b4/build.cjs
          git diff --exit-code -- creative-next/original-ui-r31-b3-b4
      - name: Frozen boundary, KMZ safety, isolated persistence, actual browser flows
        run: node creative-next/qa/r31-b3-b4/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-b3-b4-synthetic-checks
          path: |
            creative-next/qa/r31-b3-b4/*-result.json
            creative-next/qa/r31-b3-b4/*-status.json
            creative-next/qa/r31-b3-b4/*.log
# Test-only: no deploy, merge, release, old data or real KMZ access.
