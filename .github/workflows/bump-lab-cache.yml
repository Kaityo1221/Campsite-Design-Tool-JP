name: Bump lab guide cache version

on:
  push:
    paths:
      - '.github/workflows/bump-lab-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump lab-supabase cache key
        run: |
          sed -i 's/js\/lab-supabase.js?v=1/js\/lab-supabase.js?v=2/' index.html
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump lab-supabase cache key'
          git push
