name: recover-creative-lab-entry

on:
  push:
    branches: [agent/creative-jp-guide-recovery]
    paths:
      - '.github/workflows/recover-creative-lab-entry.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-jp-guide-recovery
          fetch-depth: 0
      - name: Add Creative Mode entry to Campsite Lab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lab.html')
          s = p.read_text(encoding='utf-8')
          needle = '  <a href="field-mode.html" style="display:inline-block;margin-left:8px;padding:5px 10px;border:1px solid #8b6a2f;border-radius:999px;background:#c99a3d;color:#2f2619;text-decoration:none;font-size:11px;font-weight:800;">⌖ FIELD</a>\n'
          add = '  <a href="creative/index.html" style="display:inline-block;margin-left:8px;padding:5px 10px;border:1px solid #8b6a2f;border-radius:999px;background:#f2d27b;color:#2f2619;text-decoration:none;font-size:11px;font-weight:900;">✦ CREATIVE MODE</a>\n'
          if add not in s:
              if needle not in s:
                  raise SystemExit('FIELD entry anchor not found')
              s = s.replace(needle, needle + add, 1)
              p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/recover-creative-lab-entry.yml')
          if wf.exists():
              wf.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab.html .github/workflows/recover-creative-lab-entry.yml
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Add Creative Mode entry to Campsite Lab'
          git push origin HEAD:agent/creative-jp-guide-recovery
