name: Field Mode Safety Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'field-mode.html'
      - 'css/field-mode.css'
      - 'js/field-mode-*.js'
      - 'scripts/check-field-mode.mjs'
      - 'tests/field-mode.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/field-mode-check.yml'
  workflow_dispatch:

jobs:
  field-mode-safety:
    name: field-mode-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static regression check
        run: npm run check:field-mode

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: iPhone/WebKit smoke test
        run: npm run test:field-mode

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: field-mode-playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
