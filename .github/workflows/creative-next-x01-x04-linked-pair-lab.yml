name: Creative Next X01 X04 linked pair lab
on:
  push:
    branches:
      - feature/creative-next-x01-x04-linked-bundle-lab-20261012
    paths:
      - 'creative-next/contracts/**'
      - 'creative-next/qa/x01-x04-*.test.mjs'
      - '.github/workflows/creative-next-x01-x04-linked-pair-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned synthetic KMZ tools
        run: npm install --prefix creative-next --no-save --no-package-lock --ignore-scripts jszip@3.10.1 @xmldom/xmldom@0.9.8
      - name: Parse safety and test modules
        run: |
          node --check creative-next/contracts/audit-x01-x04.mjs
          node --check creative-next/contracts/linked-project-kmz-lab.mjs
          node --check creative-next/qa/x01-x04-contract-audit.test.mjs
          node --check creative-next/qa/x01-x04-linked-pair.test.mjs
      - name: Synthetic pairing and X-01/X-04 baseline
        run: node --test creative-next/qa/x01-x04-contract-audit.test.mjs creative-next/qa/x01-x04-linked-pair.test.mjs
      - name: Native WM4A and NEW_V1 roundtrip regression
        run: |
          node scripts/check-wm4a-project-lifecycle.mjs
          node --test creative-next/phase-1b/test/create-new-kmz.test.mjs creative-next/phase-1b/test/stage-kmz.test.mjs creative-next/phase-1b/test/activity-areas.test.mjs
# LAB only; no deploy, workflow triggers only its dedicated branch.
