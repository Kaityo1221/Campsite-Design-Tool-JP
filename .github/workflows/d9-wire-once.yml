name: D9 wire once

on:
  push:
    branches: [bridge-map-lab-d9-interaction]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-map-lab-d9-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire D9 loader and runtime checks
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'needle missing: {path}')
              p.write_text(s.replace(old,new,1))

          replace_once(
              'creative/index.html',
              '"creative-patches-v55-unified-visible.js"]',
              '"creative-patches-v55-unified-visible.js","creative-patches-v56-unified-interaction.js"]'
          )

          p=Path('tests/candidate-map-engine.spec.mjs')
          s=p.read_text()
          if 'Phase 5-D9 Unified interaction parity passes on iPhone/WebKit' not in s:
              s += '''\n\ntest('Phase 5-D9 Unified interaction parity passes on iPhone/WebKit', async ({ page }) => {\n  const browserErrors = collectBrowserErrors(page);\n\n  await page.goto('/bridge-map-lab/unified-interaction-parity-test.html');\n  await expect(page.locator('#run')).toBeVisible();\n  await page.locator('#run').click();\n\n  await expect(page.locator('#summary')).toContainText('PASS');\n  const result = await page.evaluate(() => window.__unifiedInteractionParity);\n  expect(result).toBeTruthy();\n  expect(result.passed).toBe(result.total);\n  expect(result.total).toBeGreaterThanOrEqual(13);\n  expect(browserErrors).toEqual([]);\n});\n'''
              p.write_text(s)

          p=Path('scripts/check-creative-runtime-build.mjs')
          s=p.read_text()
          if "'creative-patches-v56-unified-interaction.js'" not in s:
              s=s.replace("  'creative-patches-v55-unified-visible.js'\n];", "  'creative-patches-v55-unified-visible.js',\n  'creative-patches-v56-unified-interaction.js'\n];")
          s=s.replace("assert.ok(html.includes('map-renderer.js?v=5d8'),'D8 renderer cache-bust missing');", "assert.ok(html.includes('map-renderer.js?v=5d9'),'D9 renderer cache-bust missing');")
          old="assert.ok(html.includes(\"get('unifiedRenderer')==='visible'\"),'D8 unified visible query gate missing');"
          new="assert.ok(html.includes(\"return mode==='visible'||mode==='interactive'\"),'D9 unified interactive mode must preserve visible cutover');"
          if old in s:
              s=s.replace(old,new,1)
          if "D9 unified interaction runtime missing" not in s:
              needle="assert.ok(html.includes(\"mode:unifiedVisible?'unified-visible'\"),'D8 unified visible diagnostics mode missing');"
              extra="""\nassert.ok(html.includes('cmD9UnifiedInteractionRuntime'),'D9 unified interaction runtime missing');\nassert.ok(html.includes('cmUnifiedRendererInteractive'),'D9 interactive query gate missing');\nassert.ok(html.includes('onMarkerActivate:cmUnifiedRendererInteractive()?cmUnifiedRendererActivate:null'),'D9 renderer activation bridge missing');\nassert.ok(html.includes("interactionOwner:cmUnifiedRendererInteractive()?'map-engine':'legacy'"),'D9 interaction ownership diagnostics missing');"""
              if needle not in s: raise SystemExit('D8 assertion needle missing')
              s=s.replace(needle,needle+extra,1)
          p.write_text(s)
          PY

          node --check creative/runtime/map-engine/map-renderer.js
          node --check creative/runtime/creative-patches-v56-unified-interaction.js
          node --check tests/candidate-map-engine.spec.mjs
          node scripts/check-creative-runtime-build.mjs

          git config user.name Kaityo1221
          git config user.email rakugo100@gmail.com
          git add creative/index.html tests/candidate-map-engine.spec.mjs scripts/check-creative-runtime-build.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Phase 5-D9: wire interaction runtime and WebKit gate'
          git push origin HEAD:bridge-map-lab-d9-interaction
