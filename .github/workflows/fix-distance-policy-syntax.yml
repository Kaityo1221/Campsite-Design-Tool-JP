name: fix-distance-policy-syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-distance-policy-syntax.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Repair distance policy and bust Safari cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('js/poi-spacing-policy.js')
          s = policy.read_text(encoding='utf-8')

          replacements = [
              ('すると\\n    // クロージャ', 'すると\n    // クロージャ'),
              ('書き換えない。\\n    if ', '書き換えない。\n    if '),
              ('includes("originalRunDistanceCheck")) {\\n    replaceFunctionSource', 'includes("originalRunDistanceCheck")) {\n      replaceFunctionSource'),
              ('    );\\n    }\\n  }\\n\\n  function patchKmzFunctions() {', '    );\n    }\n  }\n\n  function patchKmzFunctions() {'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected broken token not found: {old!r}')
              s = s.replace(old, new, 1)

          policy.write_text(s, encoding='utf-8')

          kmz = Path('js/kmz-upload.js')
          k = kmz.read_text(encoding='utf-8')
          if 'poi-spacing-policy.js?v=6' not in k:
              raise SystemExit('Expected policy cache version v6 not found')
          k = k.replace('poi-spacing-policy.js?v=6', 'poi-spacing-policy.js?v=7', 1)
          kmz.write_text(k, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          if 'js/kmz-upload.js?v=4' not in h:
              raise SystemExit('Expected kmz-upload cache version v4 not found')
          h = h.replace('js/kmz-upload.js?v=4', 'js/kmz-upload.js?v=5', 1)
          index.write_text(h, encoding='utf-8')
          PY

          node --check js/poi-spacing-policy.js
          node --check js/kmz-upload.js

          rm -f .github/workflows/fix-distance-policy-syntax.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/poi-spacing-policy.js js/kmz-upload.js index.html .github/workflows/fix-distance-policy-syntax.yml
          git commit -m 'Fix distance policy syntax and refresh cache'
          git push
