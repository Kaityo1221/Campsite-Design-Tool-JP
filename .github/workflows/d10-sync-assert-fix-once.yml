name: D10 sync assertion fix once

on:
  push:
    branches: [bridge-map-lab-d10-creative-interactive-e2e]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bridge-map-lab-d10-creative-interactive-e2e
      - name: Fix sync assertion placement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/creative-unified-interaction.spec.mjs')
          s=p.read_text()

          sync5="""  await expect.poll(() => page.evaluate(() => {\n    const m=window.__cmCandidateShadow?.getState?.()?.sync?.markers;\n    return m ? [m.created,m.reused,m.removed] : null;\n  })).toEqual([0,5,0]);\n"""
          sync4="""  await expect.poll(() => page.evaluate(() => {\n    const m=window.__cmCandidateShadow?.getState?.()?.sync?.markers;\n    return m ? [m.created,m.reused,m.removed] : null;\n  })).toEqual([0,4,1]);\n"""

          # Remove the accidentally inserted delete-sync assertion from initial render.
          initial="  await expect(engineExisting).toHaveCount(4);\n"+sync4+"  await expect(engineCandidate).toHaveCount(1);\n"
          fixed_initial="  await expect(engineExisting).toHaveCount(4);\n  await expect(engineCandidate).toHaveCount(1);\n"
          if initial in s:
              s=s.replace(initial,fixed_initial,1)

          undo="  await expect.poll(async () => (await workspaceRecord(page, 'c-stop'))?.latlng).toEqual(initialPosition);\n"
          if undo+sync5 not in s:
              s=s.replace(undo,undo+sync5,1)

          redo="  await expect.poll(async () => (await workspaceRecord(page, 'c-stop'))?.latlng).toEqual(movedPosition);\n"
          if redo+sync5 not in s:
              s=s.replace(redo,redo+sync5,1)

          final="  await expect(engineCandidate).toHaveCount(0);\n  await expect(engineExisting).toHaveCount(4);\n"
          if final+sync4 not in s:
              if final not in s:
                  raise SystemExit('final deletion block missing')
              s=s.replace(final,final+sync4,1)

          p.write_text(s)
          PY
          node --check tests/creative-unified-interaction.spec.mjs
          git config user.name Kaityo1221
          git config user.email rakugo100@gmail.com
          git add tests/creative-unified-interaction.spec.mjs
          git commit -m 'Phase 5-D10: place renderer sync assertions after mutations'
          git push origin HEAD:bridge-map-lab-d10-creative-interactive-e2e
