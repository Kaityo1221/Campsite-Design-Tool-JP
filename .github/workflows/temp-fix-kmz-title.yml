name: Temporary KMZ title position fix

on:
  push:
    branches:
      - agent/ui-overhaul-01-kmz-flow

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run KMZ title position fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-overhaul-01-kmz-flow

      - name: Fix KMZ title semantics and position
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          old_heading = '<h2>キャンプサイト作成の手順</h2>'
          new_heading = '<h2>キャンプサイト用KMZを作成</h2>'
          if old_heading not in index:
              raise SystemExit('Expected KMZ heading was not found')
          index = index.replace(old_heading, new_heading, 1)

          old_version = 'css/capacity.css?v=7'
          new_version = 'css/capacity.css?v=8'
          if old_version not in index:
              raise SystemExit('Expected capacity CSS version was not found')
          index = index.replace(old_version, new_version, 1)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('css/capacity.css')
          css = css_path.read_text(encoding='utf-8')

          old_title_rules = '''#tool .panel > h2 {
            font-size: 0;
          }

          #tool .panel > h2::after {
            content: "キャンプサイト用KMZを作成";
            font-size: 24px;
          }
          '''
          old_title_rules = '\n'.join(line.strip() if i in (0,1,2,3,4,5,6,7) else line for i,line in enumerate(old_title_rules.splitlines()))
          # Use exact source formatting instead of indentation-sensitive heredoc content.
          old_title_rules = '#tool .panel > h2 {\n  font-size: 0;\n}\n\n#tool .panel > h2::after {\n  content: "キャンプサイト用KMZを作成";\n  font-size: 24px;\n}\n'
          new_title_rules = '#tool .panel > h2 {\n  margin-top: 0;\n}\n'
          if old_title_rules not in css:
              raise SystemExit('Expected pseudo-title CSS was not found')
          css = css.replace(old_title_rules, new_title_rules, 1)

          old_mobile = '  #tool .panel > h2::after {\n    font-size: 21px;\n  }\n'
          new_mobile = '  #tool .panel > h2 {\n    font-size: 21px;\n  }\n'
          if old_mobile not in css:
              raise SystemExit('Expected mobile pseudo-title CSS was not found')
          css = css.replace(old_mobile, new_mobile, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

          rm .github/workflows/temp-fix-kmz-title.yml

      - name: Commit title fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix KMZ page title position'
          git push origin HEAD:agent/ui-overhaul-01-kmz-flow
