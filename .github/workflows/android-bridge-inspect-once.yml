name: Android Bridge Inspect Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-bridge-inspect-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild signed Android 0.3.4
        run: node scripts/build-android-bridge-xpi.mjs

      - name: Inspect Android Bridge UI source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q downloads/campsite-bridge-android-0.3.4.xpi -d "$tmp"
          echo '===== bridge-ui.css ====='
          cat "$tmp/bridge-ui.css"
          echo '===== bridge-ui.js relevant lines ====='
          grep -n -E -C 8 'bridgeButton|Bridge|logout|Logout|nav|menu|button|mount|sidebar|drawer|eject|collapse' "$tmp/bridge-ui.js" || true
          echo '===== manifest.json ====='
          cat "$tmp/manifest.json"
