name: Android Bridge 0.3.5 Verify Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-bridge-inspect-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android Bridge 0.3.5 candidate
        run: node scripts/check-android-bridge-0.3.5.mjs

