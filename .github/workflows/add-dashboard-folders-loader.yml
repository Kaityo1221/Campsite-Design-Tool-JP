name: Add dashboard folders loader

on:
  push:
    branches:
      - agent/post-overhaul-65-admin-review-knowledge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dashboard folders loader safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          marker = '<script src="js/main.js?v=7"></script>'
          insert = marker + '\n<script src="js/dashboard-folders.js?v=1"></script>'
          if 'js/dashboard-folders.js?v=1' not in text:
              if marker not in text:
                  raise SystemExit('main.js marker not found')
              text = text.replace(marker, insert, 1)
          p.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Load collapsible dashboard categories" || exit 0
          git push
