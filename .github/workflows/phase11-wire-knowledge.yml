name: Phase 11 wire knowledge

on:
  push:
    branches:
      - agent/ui-overhaul-11-knowledge-foundation
    paths:
      - .github/workflows/phase11-wire-knowledge.yml

permissions:
  contents: write

jobs:
  wire-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire knowledge foundation
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<script src="js/distance-errors.js?v=2"></script>'
          addition = marker + '\n<script src="js/campsite-knowledge.js?v=1"></script>'
          if 'js/campsite-knowledge.js?v=1' not in text:
              if marker not in text:
                  raise SystemExit('distance-errors cache marker not found')
              text = text.replace(marker, addition, 1)
              index.write_text(text, encoding='utf-8')

          knowledge = Path('js/campsite-knowledge.js')
          ktext = knowledge.read_text(encoding='utf-8')
          wait_block = '''

// Phase 10の診断UIは遅延読込のため、まだDOMに無い場合だけ出現を待つ。
if (!document.getElementById("site-diagnosis") && document.body) {
  const knowledgeWaitObserver = new MutationObserver(() => {
    if (!document.getElementById("site-diagnosis")) return;
    knowledgeWaitObserver.disconnect();
    setupCampsiteKnowledgeUi();
  });
  knowledgeWaitObserver.observe(document.body, { childList: true, subtree: true });
}
'''
          if 'knowledgeWaitObserver' not in ktext:
              knowledge.write_text(ktext.rstrip() + wait_block + '\n', encoding='utf-8')
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/campsite-knowledge.js
          if git diff --cached --quiet; then
            echo "No wiring change needed"
          else
            git commit -m "Wire campsite knowledge foundation"
            git push
          fi
