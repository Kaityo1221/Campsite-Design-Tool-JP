name: Creative Next r31 Session IndexedDB isolated integration
on:
  push:
    branches:
      - feature/creative-next-r31-session-idb-lab-20261012
    paths:
      - 'creative-next/contracts/**'
      - 'creative-next/qa/r31-session-indexeddb-lab.test.mjs'
      - 'creative-next/qa/r31-session-idb-browser.cjs'
      - '.github/workflows/creative-next-r31-session-idb-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r31-single-session:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: npm install --prefix creative-next --no-save --no-package-lock --ignore-scripts jszip@3.10.1 @xmldom/xmldom@0.9.8 fake-indexeddb@6
      - name: Syntax and source-only safety checks
        run: |
          node --check creative-next/contracts/r31-session-indexeddb-lab.mjs
          node --check creative-next/qa/r31-session-indexeddb-lab.test.mjs
      - name: Actual r31 Workspace/B2 Session to IndexedDB and restore
        run: node --test creative-next/qa/r31-session-indexeddb-lab.test.mjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0 leaflet@1.9.4
          npx playwright install --with-deps chromium
      - name: Real r31 UI import/add/undo/redo through isolated IndexedDB
        run: node creative-next/qa/r31-session-idb-browser.cjs
      - name: X01 X04 prior regression
        run: node --test creative-next/qa/x01-indexeddb-save-lab.test.mjs creative-next/qa/x01-design-polygon-save-channel.test.mjs creative-next/qa/x01-x04-contract-audit.test.mjs creative-next/qa/x01-x04-linked-pair.test.mjs creative-next/qa/three-function-synthetic-e2e.test.mjs
      - name: Existing r31 Session tests
        run: node --test creative-next/qa/r31-b3-b4/workspace.test.mjs
      - name: WM4A sync and NEW_V1 regression
        run: |
          node scripts/check-wm4a-project-lifecycle.mjs
          node --test creative-next/phase-1b/test/activity-areas.test.mjs creative-next/phase-1b/test/create-new-kmz.test.mjs
# Source-only CI; no deploy, no production storage, no r31 UI patch.
