name: Noah N4 QA 0.3.7 Setup Page (HOLD)

on:
  pull_request:
    branches:
      - qa/n4-mozilla-signing-acceptance-20261021
    paths:
      - 'bridge-setup-n4-qa.html'
      - 'scripts/check-n4-qa-setup-page.mjs'
      - '.github/workflows/noah-n4-qa-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA page and production isolation
        run: node scripts/check-n4-qa-setup-page.mjs
      - name: Public 0.3.5 XPI immutable
        run: echo 'f5c7d300c6cdd82758f88f651116c1b7af42863ef03e80f8ac89e39afa0fa7b7  downloads/campsite-bridge-android-0.3.5.xpi' | sha256sum -c -
      - name: No release or signing
        run: echo 'Draft HOLD, private tester pack only. Production remains 0.3.5.'
