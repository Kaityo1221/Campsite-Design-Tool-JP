name: Fix Creative CSV Layer Classification

on:
  push:
    branches:
      - feature/creative-mode-next-lab-integration
    paths:
      - .github/workflows/fix-creative-csv-layer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creative-mode-next-lab-integration
      - name: Patch CSV classifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('creative/vendor/runtime-vnext.html')
          s = p.read_text()
          old = "const layer=inferLayer(file.name,title);"
          new = "const explicit=String(csvPick(o,['nextlab-layer','nextlab_layer','layer','Layer'])||'').trim(),type=String(csvPick(o,['gameEntity','GameEntity','game_entity','Game Entity','type','Type','category','Category','種類'])||''),state=String(csvPick(o,['gameStatus','GameStatus','game_status','Game Status','status','Status'])||''),hint=(file.name+' '+title+' '+type+' '+state).toLowerCase(),fresh=/追加|新規|候補|add|new|planned/.test(hint);const layer=layerKeys.has(explicit)?explicit:(layerByLabel.get(explicit)||(/gym|ジム/.test(hint)?(fresh?'new-gym':'existing-gym'):/power|パワー/.test(hint)?(fresh?'new-power':'existing-power'):(fresh?'new-pokestop':'existing-pokestop')));"
          if old not in s:
              raise SystemExit('target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creative/vendor/runtime-vnext.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix multiple CSV layer classification"
          git push origin HEAD:feature/creative-mode-next-lab-integration
