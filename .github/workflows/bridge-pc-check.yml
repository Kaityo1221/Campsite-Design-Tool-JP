name: Campsite Bridge PC Check

on:
  push:
    branches:
      - main
    paths:
      - 'bridge-pc/**'
      - 'bridge-receiver.html'
      - 'docs/bridge-pc-minimum-spec-v1.md'
      - 'docs/bridge-poi-engine-spec-v1.md'
      - 'scripts/build-pc-bridge.mjs'
      - 'scripts/check-bridge-wayfarer-map-adapter.mjs'
      - 'scripts/check-bridge-wayfarer-display-owner.mjs'
      - 'scripts/check-bridge-wayfarer-deck-compat.mjs'
      - 'scripts/check-bridge-poi-parser.mjs'
      - 'scripts/check-bridge-poi-classifier.mjs'
      - 'scripts/check-bridge-display-ownership.mjs'
      - 'scripts/check-bridge-v1-export.mjs'
      - 'scripts/check-bridge-poi-engine-regression.mjs'
      - 'scripts/check-bridge-poi-engine-e2e.mjs'
      - 'scripts/check-bridge-poi-diagnostics.mjs'
      - 'scripts/check-bridge-kwajalein-regression.mjs'
      - 'scripts/check-bridge-receiver-routing.mjs'
      - 'scripts/check-pc-bridge.mjs'
      - 'scripts/check-pc-next-route.mjs'
      - 'scripts/fixtures/bridge-poi-engine-regression.json'
      - 'scripts/fixtures/bridge-poi-engine-kwajalein-v1.1.json'
      - 'js/bridge-wayfarer-map-adapter.js'
      - 'js/bridge-wayfarer-display-owner.js'
      - 'js/bridge-wayfarer-deck-compat.js'
      - 'js/bridge-next-flow.js'
      - 'js/bridge-selection.js'
      - 'bridge-gateway.html'
      - 'creative/index.html'
      - 'package.json'
      - '.github/workflows/bridge-pc-check.yml'
  pull_request:
    paths:
      - 'bridge-pc/**'
      - 'bridge-receiver.html'
      - 'docs/bridge-pc-minimum-spec-v1.md'
      - 'docs/bridge-poi-engine-spec-v1.md'
      - 'scripts/build-pc-bridge.mjs'
      - 'scripts/check-bridge-wayfarer-map-adapter.mjs'
      - 'scripts/check-bridge-wayfarer-display-owner.mjs'
      - 'scripts/check-bridge-wayfarer-deck-compat.mjs'
      - 'scripts/check-bridge-poi-parser.mjs'
      - 'scripts/check-bridge-poi-classifier.mjs'
      - 'scripts/check-bridge-display-ownership.mjs'
      - 'scripts/check-bridge-v1-export.mjs'
      - 'scripts/check-bridge-poi-engine-regression.mjs'
      - 'scripts/check-bridge-poi-engine-e2e.mjs'
      - 'scripts/check-bridge-poi-diagnostics.mjs'
      - 'scripts/check-bridge-kwajalein-regression.mjs'
      - 'scripts/check-bridge-receiver-routing.mjs'
      - 'scripts/check-pc-bridge.mjs'
      - 'scripts/check-pc-next-route.mjs'
      - 'scripts/fixtures/bridge-poi-engine-regression.json'
      - 'scripts/fixtures/bridge-poi-engine-kwajalein-v1.1.json'
      - 'js/bridge-wayfarer-map-adapter.js'
      - 'js/bridge-wayfarer-display-owner.js'
      - 'js/bridge-wayfarer-deck-compat.js'
      - 'js/bridge-next-flow.js'
      - 'js/bridge-selection.js'
      - 'bridge-gateway.html'
      - 'creative/index.html'
      - 'package.json'
      - '.github/workflows/bridge-pc-check.yml'
  workflow_dispatch:

jobs:
  pc-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Final Bridge architecture check
        run: npm run check:bridge-architecture

      - name: POI v1.1 regression locks
        run: |
          node scripts/check-bridge-kwajalein-regression.mjs
          node scripts/check-bridge-receiver-routing.mjs

      - name: Syntax check
        run: |
          node --check bridge-pc/poi-parser.js
          node --check bridge-pc/poi-classifier.js
          node --check bridge-pc/poi-reference-layer.js
          node --check bridge-pc/poi-diagnostics.js
          node --check bridge-pc/bridge-v1-exporter.js
          node --check bridge-pc/page-collector.js
          node --check bridge-pc/content.js
          node --check js/bridge-wayfarer-map-adapter.js
          node --check js/bridge-wayfarer-display-owner.js
          node --check js/bridge-wayfarer-deck-compat.js
          node --check js/bridge-next-flow.js
          node --check scripts/build-pc-bridge.mjs
          node --check scripts/check-bridge-wayfarer-map-adapter.mjs
          node --check scripts/check-bridge-wayfarer-display-owner.mjs
          node --check scripts/check-bridge-wayfarer-deck-compat.mjs
          node --check scripts/check-bridge-poi-parser.mjs
          node --check scripts/check-bridge-poi-classifier.mjs
          node --check scripts/check-bridge-display-ownership.mjs
          node --check scripts/check-bridge-v1-export.mjs
          node --check scripts/check-bridge-poi-diagnostics.mjs
          node --check scripts/check-bridge-poi-engine-regression.mjs
          node --check scripts/check-bridge-poi-engine-e2e.mjs
          node --check scripts/check-bridge-kwajalein-regression.mjs
          node --check scripts/check-bridge-receiver-routing.mjs
          node --check scripts/check-pc-bridge.mjs
          node --check scripts/check-pc-next-route.mjs
