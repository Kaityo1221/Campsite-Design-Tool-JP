name: Campsite Bridge iPhone Check

on:
  push:
    paths:
      - 'dist/bridge-shortcut/1.0.0/**'
      - 'js/bridge-shortcut/shortcut-launcher.js'
      - 'scripts/check-bridge-poi-colors.mjs'
      - '.github/workflows/bridge-iphone-check.yml'
  pull_request:
    paths:
      - 'dist/bridge-shortcut/1.0.0/**'
      - 'js/bridge-shortcut/shortcut-launcher.js'
      - 'scripts/check-bridge-poi-colors.mjs'
      - '.github/workflows/bridge-iphone-check.yml'
  workflow_dispatch:

jobs:
  iphone-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check iPhone data-only display policy
        run: node scripts/check-bridge-poi-colors.mjs

      - name: Syntax check stable entrypoints
        run: |
          node --check js/bridge-shortcut/shortcut-launcher.js
          node --check dist/bridge-shortcut/1.0.0/runtime.part-09.iphone-wfmm-color-policy.js
          node --check scripts/check-bridge-poi-colors.mjs
