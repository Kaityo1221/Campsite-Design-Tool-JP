name: Wire extracted campsite file guide

on:
  push:
    paths:
      - '.github/workflows/extract-campsite-file-guide.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add campsite file guide script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('js/lab-supabase.js?v=2', 'js/lab-supabase.js?v=3')
          marker = '<script src="js/main.js?v=8"></script>\n'
          addition = marker + '<script src="js/campsite-file-guide.js?v=1"></script>\n'
          if 'js/campsite-file-guide.js?v=1' not in text:
              if marker not in text:
                  raise SystemExit('main.js script marker not found')
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load extracted campsite file guide UI'
          git push
