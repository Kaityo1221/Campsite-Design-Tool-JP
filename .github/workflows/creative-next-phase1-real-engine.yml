name: Creative Next Phase 1 Real Engine
on:
  push:
    branches: [feature/creative-next-ui-exact-parity-20261010]
    paths:
      - 'creative-next/integration/real-engine-original-ui.mjs'
      - 'creative-next/qa/real-engine-original-ui.test.mjs'
      - '.github/workflows/creative-next-phase1-real-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jszip@3.10.1 @xmldom/xmldom@0.9.8
      - run: node creative-next/qa/current-creative-ui-source-parity.cjs
      - run: node creative-next/qa/real-engine-original-ui.test.mjs
