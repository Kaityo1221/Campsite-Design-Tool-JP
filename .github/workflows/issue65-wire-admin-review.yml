name: Issue 65 wire admin review record

on:
  push:
    branches:
      - agent/post-overhaul-65-admin-review-knowledge
    paths:
      - .github/workflows/issue65-wire-admin-review.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add admin review record script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="js/admin.js?v=2"></script>'
          addition = marker + '\n<script src="js/admin-review-knowledge.js?v=1"></script>'
          if 'js/admin-review-knowledge.js?v=1' not in text:
              if marker not in text:
                  raise SystemExit('admin.js marker not found')
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No wiring change needed"
          else
            git commit -m "Load admin review knowledge recorder"
            git push
          fi
