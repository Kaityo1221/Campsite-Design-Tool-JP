name: Temporary tabs cache bump v3

on:
  push:
    branches:
      - agent/ui-overhaul-02-kmz-complete
    paths:
      - .tmp-bump-tabs-v3

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-overhaul-02-kmz-complete

      - name: Bump tabs script cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'js/tabs.js?v=2'
          new = 'js/tabs.js?v=3'
          if old not in text:
              raise SystemExit(f'Expected value not found: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .tmp-bump-tabs-v3
          rm .github/workflows/temp-bump-tabs-v3.yml

      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bump tabs cache version to v3'
          git push origin HEAD:agent/ui-overhaul-02-kmz-complete
