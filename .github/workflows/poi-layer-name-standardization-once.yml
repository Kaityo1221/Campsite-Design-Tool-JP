name: POI layer name standardization package

on:
  push:
    branches:
      - "agent/poi-layer-name-standardization"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/poi-layer-name-standardization"
          fetch-depth: 0
      - name: Apply package
        run: python3 scripts/poi-layer-standardize.py
      - name: Install dependencies
        run: npm ci
      - name: Verify contract
        run: npx playwright test tests/poi-layer-name-contract.spec.mjs
      - name: Verify field mode static checks
        run: npm run check:field-mode
      - name: Commit release candidate
        run: |
          rm -f .poi-layer-package-ready
          rm -f scripts/poi-layer-standardize.py
          rm -f .github/workflows/poi-layer-name-standardization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Package formal POI layer names with legacy KMZ compatibility"
          git push origin HEAD:agent/poi-layer-name-standardization
