name: POI layer name standardization package

on:
  push:
    branches:
      - "agent/poi-layer-name-standardization"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/poi-layer-name-standardization"
      - name: Verify package runner
        run: |
          echo "package-runner-ready" > .poi-layer-package-ready
      - name: Commit marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .poi-layer-package-ready
          git commit -m "Verify POI layer package runner"
          git push origin HEAD:agent/poi-layer-name-standardization
