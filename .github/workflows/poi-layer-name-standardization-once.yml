name: POI layer name standardization package

on:
  push:
    branches:
      - "agent/poi-layer-name-standardization"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/poi-layer-name-standardization"
          fetch-depth: 0

      - name: Apply formal POI layer names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          FORMAL = [
              '既存 PokéStop', '既存 Gym', '既存 PowerSpot',
              '新規 PokéStop', '新規 Gym', '新規 PowerSpot'
          ]
          LEGACY = {
              '既存のポケストップ': '既存 PokéStop',
              '既存のジム': '既存 Gym',
              '既存のパワースポット': '既存 PowerSpot',
              '追加希望ポケスト': '新規 PokéStop',
              '追加希望ジム': '新規 Gym',
              '追加希望パワスポ': '新規 PowerSpot',
              '追加 PokéStop': '新規 PokéStop',
              '追加 Gym': '新規 Gym',
              '追加 PowerSpot': '新規 PowerSpot',
          }

          shared = """(() => {
            'use strict';
            const FORMAL = Object.freeze({
              existingPokestop: '既存 PokéStop',
              existingGym: '既存 Gym',
              existingPowerSpot: '既存 PowerSpot',
              newPokestop: '新規 PokéStop',
              newGym: '新規 Gym',
              newPowerSpot: '新規 PowerSpot'
            });
            const aliases = new Map([
              ['既存 PokéStop', FORMAL.existingPokestop],
              ['既存 Gym', FORMAL.existingGym],
              ['既存 PowerSpot', FORMAL.existingPowerSpot],
              ['新規 PokéStop', FORMAL.newPokestop],
              ['新規 Gym', FORMAL.newGym],
              ['新規 PowerSpot', FORMAL.newPowerSpot],
              ['既存のポケストップ', FORMAL.existingPokestop],
              ['既存のジム', FORMAL.existingGym],
              ['既存のパワースポット', FORMAL.existingPowerSpot],
              ['追加希望ポケスト', FORMAL.newPokestop],
              ['追加希望ジム', FORMAL.newGym],
              ['追加希望パワスポ', FORMAL.newPowerSpot],
              ['追加 PokéStop', FORMAL.newPokestop],
              ['追加 Gym', FORMAL.newGym],
              ['追加 PowerSpot', FORMAL.newPowerSpot]
            ]);
            const norm = value => String(value || '').normalize('NFKC').trim().toLowerCase().replace(/[\\s　_＿\\-－ー]+/g, '');
            const normalized = new Map();
            aliases.forEach((canonical, alias) => normalized.set(norm(alias), canonical));
            const canonicalize = value => {
              const raw = String(value || '').trim();
              return aliases.get(raw) || normalized.get(norm(raw)) || raw;
            };
            const formalSet = new Set(Object.values(FORMAL));
            const isFormal = value => formalSet.has(String(value || '').trim());
            window.CampsitePoiLayerNames = Object.freeze({ FORMAL, canonicalize, isFormal });
          })();
          """
          Path('js/poi-layer-names.js').write_text(shared, encoding='utf-8')

          # New KMZ generation always emits formal names.
          p = Path('js/kmz.js')
          text = p.read_text(encoding='utf-8')
          for old, new in LEGACY.items():
              text = text.replace(f'"{old}"', f'"{new}"').replace(f"'{old}'", f"'{new}'")
          p.write_text(text, encoding='utf-8')

          # Shared reader normalizes old folder names immediately on import.
          p = Path('js/util.js')
          text = p.read_text(encoding='utf-8')
          old = '      const layer = getParentFolderName(placemark);'
          if old not in text:
              raise SystemExit('util.js anchor missing')
          new = "      const rawLayer = getParentFolderName(placemark);\n      const layer = window.CampsitePoiLayerNames?.canonicalize(rawLayer) || rawLayer;"
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Field mode uses formal names for newly created POIs.
          p = Path('js/field-mode-export.js')
          text = p.read_text(encoding='utf-8')
          exact = {
              "pokestop:'追加希望ポケスト'": "pokestop:'新規 PokéStop'",
              "gym:'追加希望ジム'": "gym:'新規 Gym'",
              "power:'追加希望パワスポ'": "power:'新規 PowerSpot'",
              "power_spot:'追加希望パワスポ'": "power_spot:'新規 PowerSpot'",
              "||'追加希望ポケスト';": "||'新規 PokéStop';",
          }
          for old, new in exact.items():
              if old not in text:
                  raise SystemExit(f'field-mode-export anchor missing: {old}')
              text = text.replace(old, new)

          direct = "  function directName(node){return Array.from(node.children||[]).find(el=>el.localName==='name')?.textContent?.trim()||'';}\n"
          normalize_helper = "  function normalizePoiFolderNames(doc){const api=window.CampsitePoiLayerNames;if(!api)return;const targets=new Map();Array.from(doc.getElementsByTagNameNS('*','Folder')).forEach(folder=>{const raw=directName(folder),canonical=api.canonicalize(raw);if(!api.isFormal(canonical))return;const nameNode=Array.from(folder.children||[]).find(el=>el.localName==='name');if(nameNode)nameNode.textContent=canonical;const target=targets.get(canonical);if(target&&target!==folder){Array.from(folder.children||[]).filter(el=>el.localName!=='name').forEach(el=>target.appendChild(el));folder.remove();}else{targets.set(canonical,folder);}});}\n"
          if normalize_helper not in text:
              if direct not in text:
                  raise SystemExit('field-mode-export directName anchor missing')
              text = text.replace(direct, direct + normalize_helper, 1)

          export_old = "const documentNode=doc.getElementsByTagNameNS('*','Document')[0]||doc.documentElement,outZip=source.zip||new JSZip(),recordMap=buildOriginalPlacemarkMap(doc);"
          export_new = "const documentNode=doc.getElementsByTagNameNS('*','Document')[0]||doc.documentElement;normalizePoiFolderNames(doc);const outZip=source.zip||new JSZip(),recordMap=buildOriginalPlacemarkMap(doc);"
          if export_old not in text:
              raise SystemExit('field-mode-export export anchor missing')
          text = text.replace(export_old, export_new, 1)
          p.write_text(text, encoding='utf-8')

          # User-facing exact layer-name references. Generic wording like 追加POI remains unchanged.
          for filename in ['index.html', 'field-mode.html', 'js/support-faq-mymaps.js', 'js/campsite-file-guide.js']:
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for old, new in LEGACY.items():
                  text = text.replace(old, new)
              if filename == 'index.html':
                  text = text.replace('「既存」または「追加」を入れてください。', '正式なレイヤー名を使用してください。')
                  text = text.replace('<strong>「既存」</strong> または <strong>「追加」</strong> を入れてください。', '<strong>正式な6つのレイヤー名</strong>を使用してください。')
              p.write_text(text, encoding='utf-8')

          # Tests now expect formal output names.
          p = Path('tests/field-mode-layer-routing.spec.mjs')
          text = p.read_text(encoding='utf-8')
          for old, new in LEGACY.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          # Add contract test for formal names and legacy aliases.
          contract = """import { test, expect } from '@playwright/test';
          import fs from 'node:fs';

          test('POI layer name contract keeps formal output and legacy read aliases', async () => {
            const shared = fs.readFileSync('js/poi-layer-names.js', 'utf8');
            for (const name of ['既存 PokéStop','既存 Gym','既存 PowerSpot','新規 PokéStop','新規 Gym','新規 PowerSpot']) {
              expect(shared).toContain(name);
            }
            for (const legacy of ['既存のポケストップ','既存のジム','既存のパワースポット','追加希望ポケスト','追加希望ジム','追加希望パワスポ']) {
              expect(shared).toContain(legacy);
            }
            const kmz = fs.readFileSync('js/kmz.js', 'utf8');
            expect(kmz).toContain('既存 PokéStop');
            expect(kmz).toContain('新規 PokéStop');
            const field = fs.readFileSync('js/field-mode-export.js', 'utf8');
            expect(field).toContain("pokestop:'新規 PokéStop'");
          });
          """
          Path('tests/poi-layer-name-contract.spec.mjs').write_text(contract, encoding='utf-8')

          def insert_script(html_path, anchors):
              p = Path(html_path)
              text = p.read_text(encoding='utf-8')
              if 'js/poi-layer-names.js' not in text:
                  for anchor in anchors:
                      idx = text.find(anchor)
                      if idx >= 0:
                          text = text[:idx] + '<script src="js/poi-layer-names.js?v=1"></script>\n' + text[idx:]
                          break
                  else:
                      raise SystemExit(f'{html_path}: script insertion anchor missing')
              p.write_text(text, encoding='utf-8')

          insert_script('index.html', ['<script src="js/kmz.js', '<script src="js/distance-poi.js'])
          insert_script('field-mode.html', ['<script src="js/field-mode-export.js', '<script src="js/field-mode-apac-v4.js'])

          # Cache bust changed JS references.
          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              for filename in ['util.js', 'kmz.js', 'field-mode-export.js']:
                  pattern = re.compile(rf'(src="js/{re.escape(filename)})(?:\?v=(\d+))?("[^>]*></script>)')
                  text = pattern.sub(lambda m: f'{m.group(1)}?v={int(m.group(2) or 0)+1}{m.group(3)}', text)
              html.write_text(text, encoding='utf-8')

          note = """# POIレイヤー正式名称 2026-08-17 リリース候補

## 正式名称
- 既存 PokéStop
- 既存 Gym
- 既存 PowerSpot
- 新規 PokéStop
- 新規 Gym
- 新規 PowerSpot

## 互換
旧KMZの「既存のポケストップ / 既存のジム / 既存のパワースポット」および「追加希望ポケスト / 追加希望ジム / 追加希望パワスポ」は読み込み互換を維持する。再出力時は正式名称へ正規化する。

## 23:00確認
1. 新規KMZ生成
2. 旧KMZ読込
3. 距離チェック
4. 現地モード編集後の再出力
5. 6名称の完全一致
6. iPhone Safariでキャッシュ更新確認
"""
          Path('docs/POI_LAYER_NAME_RELEASE_20260817.md').write_text(note, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: npm ci

      - name: Run contract and field mode checks
        run: |
          npx playwright test tests/poi-layer-name-contract.spec.mjs
          npm run check:field-mode

      - name: Commit release candidate
        run: |
          rm -f .poi-layer-package-ready
          rm -f .github/workflows/poi-layer-name-standardization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Package formal POI layer names with legacy KMZ compatibility"
          git push origin HEAD:agent/poi-layer-name-standardization
