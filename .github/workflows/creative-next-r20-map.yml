name: Creative Next r20 Readonly Map
on:
  push:
    branches: [feature/creative-next-ui-exact-parity-20261010]
    paths:
      - 'creative-next/original-ui-r20/**'
      - 'creative-next/qa/readonly-map-r20.test.mjs'
      - '.github/workflows/creative-next-r20-map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node creative-next/qa/current-creative-ui-source-parity.cjs
      - run: node creative-next/qa/creative-next-original-leaflet-overlay.test.mjs
      - run: node creative-next/qa/readonly-map-r20.test.mjs
