name: Patch opened tab scroll

on:
  push:
    branches:
      - agent/scroll-to-opened-function

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scroll to opened function instead of page top
        run: |
          python - <<'PY'
          from pathlib import Path

          tabs = Path('js/tabs.js')
          text = tabs.read_text()
          old = '''  window.scrollTo({\n    top: 0,\n    behavior: "smooth"\n  });\n}'''
          new = '''  if (targetTab) {\n    requestAnimationFrame(() => {\n      const targetTop =\n        targetTab.getBoundingClientRect().top +\n        window.scrollY -\n        16;\n\n      window.scrollTo({\n        top: Math.max(0, targetTop),\n        behavior: "smooth"\n      });\n    });\n  }\n}'''
          if old not in text:
              raise SystemExit('openTab scroll marker not found')
          text = text.replace(old, new, 1)
          tabs.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          old_cache = 'js/tabs.js?v=3'
          new_cache = 'js/tabs.js?v=4'
          if old_cache not in text:
              raise SystemExit('tabs cache marker not found')
          text = text.replace(old_cache, new_cache, 1)
          index.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/tabs.js index.html
          git commit -m "Scroll to opened function panel" || exit 0
          git push
