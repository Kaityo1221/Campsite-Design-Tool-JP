name: Workflow Resume Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/workflow-resume.js'
      - 'js/post-completion-hub.js'
      - 'tests/workflow-resume.spec.mjs'
      - '.github/workflows/workflow-resume-check.yml'
      - 'playwright.config.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  workflow-resume:
    name: workflow-resume
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: node --check js/workflow-resume.js

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: iPhone/WebKit resume test
        run: npx playwright test tests/workflow-resume.spec.mjs

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-resume-playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
