name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp shared UI asset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          build = os.environ['GITHUB_SHA']
          replacements = [
              (re.compile(r'css/style\.css\?[^"\']*'), f'css/style.css?build={build}'),
              (re.compile(r'css/placement-strategy-symbols\.css\?[^"\']*'), f'css/placement-strategy-symbols.css?build={build}'),
              (re.compile(r'js/placement-strategy-symbols\.js\?[^"\']*'), f'js/placement-strategy-symbols.js?build={build}'),
              (re.compile(r'css/placement-strategy-break\.css\?[^"\']*'), f'css/placement-strategy-break.css?build={build}'),
              (re.compile(r'js/placement-strategy-break\.js\?[^"\']*'), f'js/placement-strategy-break.js?build={build}'),
              (re.compile(r'css/placement-strategy-break-effect\.css\?[^"\']*'), f'css/placement-strategy-break-effect.css?build={build}'),
              (re.compile(r'js/placement-strategy-break-effect\.js\?[^"\']*'), f'js/placement-strategy-break-effect.js?build={build}'),
              (re.compile(r'css/placement-strategy-map-ready\.css\?[^"\']*'), f'css/placement-strategy-map-ready.css?build={build}'),
              (re.compile(r'js/placement-strategy-map-ready\.js\?[^"\']*'), f'js/placement-strategy-map-ready.js?build={build}'),
              (re.compile(r'css/placement-strategy-map-theme\.css\?[^"\']*'), f'css/placement-strategy-map-theme.css?build={build}'),
              (re.compile(r'js/placement-strategy-map-theme\.js\?[^"\']*'), f'js/placement-strategy-map-theme.js?build={build}'),
          ]

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern, replacement in replacements:
                  updated = pattern.sub(replacement, updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Stamped shared UI assets for build {build}')
          print('Updated HTML:', ', '.join(changed) if changed else 'none')
          PY

      - name: Inject Campsite flow compact UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          build = os.environ['GITHUB_SHA']

          text = re.sub(
              r'\s*<script[^>]+data-campsite-flow-compact[^>]*></script>\s*',
              '\n',
              text,
              flags=re.IGNORECASE,
          )

          tag = (
              f'<script src="js/campsite-flow-compact.js?build={build}" '
              'data-campsite-flow-compact="1"></script>'
          )

          if '</body>' not in text:
              raise SystemExit('index.html does not contain </body>')

          text = text.replace('</body>', f'{tag}\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print(f'Injected Campsite flow compact UI: {tag}')
          PY

      - name: Stamp Lab asset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('lab.html')
          text = path.read_text(encoding='utf-8')
          old = 'js/lab-supabase.js?v=20260705-v17'
          new = f"js/lab-supabase.js?build={os.environ['GITHUB_SHA']}"
          if old in text:
              text = text.replace(old, new)
          else:
              import re
              text = re.sub(r'js/lab-supabase\.js\?[^"\']*', new, text)
          path.write_text(text, encoding='utf-8')
          print(f'Stamped Lab shell: {new}')
          PY

      - name: Build Campsite Bridge Shortcut 1.0.0
        shell: bash
        run: |
          set -euo pipefail

          src='dist/bridge-shortcut/1.0.0'
          out_dir='js/bridge-shortcut'
          versioned="$out_dir/campsite-bridge-shortcut-runtime-1.0.0.js"
          latest="$out_dir/campsite-bridge-shortcut-runtime.js"

          mkdir -p "$out_dir"
          cat "$src"/runtime.part-*.js > "$versioned"

          actual="$(sha256sum "$versioned" | awk '{print $1}')"

          node --check "$versioned"
          cp "$versioned" "$latest"

          cat > "$out_dir/latest.json" <<EOF
          {
            "product": "Campsite Bridge",
            "platform": "iPhone / iPad Shortcut",
            "version": "1.0.0",
            "source": "0.2.7 NOFLICKER + POI COLORS",
            "sha256": "$actual",
            "runtime": "campsite-bridge-shortcut-runtime-1.0.0.js",
            "latest": "campsite-bridge-shortcut-runtime.js"
          }
          EOF

          echo "Built Campsite Bridge Shortcut 1.0.0"
          echo "SHA-256: $actual"

      - name: Check Bridge POI color overlay
        run: |
          node --check js/bridge-wayfarer-poi-colors.js
          node --check js/bridge-shortcut/shortcut-launcher.js
          node scripts/check-bridge-poi-colors.mjs

      - name: Build Campsite Bridge Android 0.3.4
        run: node scripts/build-android-bridge-xpi.mjs

      - name: Verify Campsite Bridge Android 0.3.5 signed
        shell: bash
        run: |
          set -euo pipefail
          xpi='downloads/campsite-bridge-android-0.3.5.xpi'
          expected='f5c7d300c6cdd82758f88f651116c1b7af42863ef03e80f8ac89e39afa0fa7b7'
          actual="$(sha256sum "$xpi" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "Campsite Bridge Android 0.3.5 SHA-256 mismatch"
            echo "expected: $expected"
            echo "actual:   $actual"
            exit 1
          fi
          unzip -l "$xpi" | grep -q 'META-INF/mozilla.rsa'
          unzip -l "$xpi" | grep -q 'META-INF/cose.sig'
          unzip -p "$xpi" manifest.json | grep -q '"version": "0.3.5"'
          echo "Verified signed Android 0.3.5: $actual"

      - name: Build Campsite Bridge Android 0.3.6 unsigned candidate
        run: node scripts/build-android-bridge-0.3.6-unsigned.mjs

      - name: Build Campsite Bridge PC 0.1.0
        run: node scripts/build-pc-bridge.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
