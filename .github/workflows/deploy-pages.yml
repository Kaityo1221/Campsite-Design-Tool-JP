name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp Lab asset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('lab.html')
          text = path.read_text(encoding='utf-8')
          old = 'js/lab-supabase.js?v=20260705-v17'
          new = f"js/lab-supabase.js?build={os.environ['GITHUB_SHA']}"
          if old in text:
              text = text.replace(old, new)
          else:
              import re
              text = re.sub(r'js/lab-supabase\.js\?[^"\']*', new, text)
          path.write_text(text, encoding='utf-8')
          print(f'Stamped Lab shell: {new}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
