name: Campsite Bridge Setup Check

on:
  pull_request:
    paths:
      - 'bridge-setup.html'
      - 'bridge-shortcut-install.html'
      - 'js/bridge-setup.js'
      - 'js/bridge-setup-config.js'
      - 'js/bridge-shortcut/shortcut-launcher.js'
      - 'dist/android-bridge-0.3.4/**'
      - 'downloads/campsite-bridge-android-0.3.5.xpi'
      - 'bridge-pc/**'
      - 'scripts/build-android-bridge-xpi.mjs'
      - 'scripts/build-android-bridge-0.3.5-unsigned.mjs'
      - 'scripts/check-android-bridge-0.3.5.mjs'
      - 'scripts/build-android-bridge-0.3.6-unsigned.mjs'
      - 'scripts/build-android-bridge-0.3.7-unsigned.mjs'
      - 'bridge-android-n4/**'
      - 'scripts/check-n4a-android-xpi-contract.mjs'
      - 'scripts/check-n4b-android-map-seam.mjs'
      - 'scripts/check-n4c-android-wiring.mjs'
      - 'scripts/check-n4e-android-gcs-boundary.mjs'
      - 'scripts/inspect-n4e-page-hook-gcs.mjs'
      - 'scripts/check-n4e-android-acquisition-wiring.mjs'
      - 'scripts/check-n4f-android-observation.mjs'
      - 'scripts/check-n4g-android-receiver-handoff.mjs'
      - 'scripts/check-n4-android-final-regression.mjs'
      - 'scripts/build-pc-bridge.mjs'
      - 'scripts/check-bridge-setup.mjs'
      - '.github/workflows/bridge-setup-check.yml'
  workflow_dispatch:

jobs:
  bridge-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contract check
        run: |
          node scripts/check-bridge-setup.mjs
          node scripts/check-android-bridge-0.3.5.mjs
          node scripts/check-n4a-android-xpi-contract.mjs
          node scripts/check-n4b-android-map-seam.mjs
          node scripts/build-android-bridge-0.3.7-unsigned.mjs
          node scripts/check-n4c-android-wiring.mjs
          node scripts/check-n4e-android-gcs-boundary.mjs
          node scripts/inspect-n4e-page-hook-gcs.mjs
          node scripts/check-n4e-android-acquisition-wiring.mjs
          node scripts/check-n4f-android-observation.mjs
          node scripts/check-n4g-android-receiver-handoff.mjs
          node scripts/check-n4-android-final-regression.mjs

      - name: Launcher syntax
        run: |
          node --check js/bridge-shortcut/shortcut-launcher.js
          node --check js/bridge-setup.js
          node --check js/bridge-setup-config.js
          node --check scripts/build-android-bridge-0.3.5-unsigned.mjs
          node --check scripts/check-android-bridge-0.3.5.mjs
          node --check scripts/build-android-bridge-0.3.6-unsigned.mjs
          node --check scripts/check-n4a-android-xpi-contract.mjs
          node --check scripts/check-n4b-android-map-seam.mjs
          node --check scripts/build-android-bridge-0.3.7-unsigned.mjs
          node --check scripts/check-n4c-android-wiring.mjs
          node --check scripts/check-n4e-android-gcs-boundary.mjs
          node --check scripts/inspect-n4e-page-hook-gcs.mjs
          node --check scripts/check-n4e-android-acquisition-wiring.mjs
          node --check scripts/check-n4f-android-observation.mjs
          node --check scripts/check-n4g-android-receiver-handoff.mjs
          node --check scripts/check-n4-android-final-regression.mjs
          node --check bridge-android-n4/wayfarer-acquisition-coordinator.js
          node --check bridge-android-n4/wayfarer-map-adapter.js
          node --check bridge-pc/page-collector.js
          node --check bridge-pc/content.js
