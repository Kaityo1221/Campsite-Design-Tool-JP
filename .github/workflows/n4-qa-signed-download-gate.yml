name: N4 QA signed download gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'bridge-setup-n4.html'
      - 'downloads/campsite-bridge-android-n4-qa-0.3.7-signed.xpi'
      - 'scripts/check-n4-qa-download.mjs'
      - '.github/workflows/n4-qa-signed-download-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact signed QA file and link (must fail if missing)
        run: node scripts/check-n4-qa-download.mjs
      - name: Protect public 0.3.5
        run: echo 'f5c7d300c6cdd82758f88f651116c1b7af42863ef03e80f8ac89e39afa0fa7b7  downloads/campsite-bridge-android-0.3.5.xpi' | sha256sum -c -
