name: preview-poi-tool-no-recenter-once
on:
  push:
    branches:
      - agent/creative-mode-apac-v4-preview
    paths:
      - .github/workflows/preview-poi-tool-no-recenter-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creative-mode-apac-v4-preview
      - name: Patch POI tool selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/field-mode-creative.js')
          s=p.read_text()
          old="""    if(button.dataset.tool==='poi'&&newPoiButtonEl&&!newPoiButtonEl.disabled){\n      newPoiButtonEl.click();\n      return;\n    }\n    selectTool(button.dataset.tool,{collapse:true});"""
          new="""    if(button.dataset.tool==='poi'){\n      selectTool('poi',{collapse:true});\n      return;\n    }\n    selectTool(button.dataset.tool,{collapse:true});"""
          if old not in s:
              raise SystemExit('target POI hotbar block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check js/field-mode-creative.js
      - name: Remove one-time workflow
        run: rm .github/workflows/preview-poi-tool-no-recenter-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/field-mode-creative.js .github/workflows/preview-poi-tool-no-recenter-once.yml
          git commit -m "Keep map position when selecting POI tool"
          git push origin HEAD:agent/creative-mode-apac-v4-preview