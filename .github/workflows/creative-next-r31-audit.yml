name: Creative Next r31 source isolation audit
on:
  push:
    branches: [codex/original-ui-r31]
    paths: ['creative-next/qa/r31/**', 'creative-next/R31_*', '.github/workflows/creative-next-r31-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/codex/original-ui-r31'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated QA dependencies
        run: npm install --prefix creative-next --no-save --no-package-lock --ignore-scripts jszip@3.10.1 @xmldom/xmldom@0.9.8 acorn@8.15.0 playwright@1.56.0
      - name: Verify audit safeguards and frozen sources
        run: node --test creative-next/qa/r31/source-audit.test.cjs
      - name: Run unchanged engine and integration regression
        run: node --test creative-next/phase-1a/tests/poi-core.test.mjs creative-next/phase-1b/test/*.test.mjs creative-next/qa/*.test.mjs creative-next/qa/*.test.cjs
      - name: Inventory UI and unsafe legacy dependencies (HOLD fails this gate)
        if: always()
        run: node creative-next/qa/r31/source-audit.cjs
      - name: Install isolated Chromium
        if: always()
        run: creative-next/node_modules/.bin/playwright install --with-deps chromium
      - name: Diagnose production UI versus unchanged r30 (not r31 acceptance)
        if: always()
        run: node creative-next/qa/r31/browser-diagnostic.cjs
      - name: Preserve synthetic audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r31-hold-audit
          path: |
            creative-next/qa/r31/source-inventory.json
            creative-next/qa/r31/browser-diagnostic.json
            creative-next/qa/r31/artifacts/*.png
# No preview build, publishing credentials, Pages upload, or deployment step.
