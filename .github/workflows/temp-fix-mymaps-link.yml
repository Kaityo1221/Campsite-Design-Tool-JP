name: Temporary My Maps link fix

on:
  push:
    branches:
      - agent/ui-overhaul-02-kmz-complete

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run My Maps link fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-overhaul-02-kmz-complete

      - name: Replace Google Maps universal link with My Maps host
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('js/main.js')
          main = main_path.read_text(encoding='utf-8')
          old_url = '"https://www.google.com/maps/d/"'
          new_url = '"https://mymaps.google.com/"'
          if old_url not in main:
              raise SystemExit(f'Expected My Maps URL not found: {old_url}')
          main_path.write_text(main.replace(old_url, new_url, 1), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = 'js/main.js?v=6'
          new_version = 'js/main.js?v=7'
          if old_version not in index:
              raise SystemExit(f'Expected main.js version not found: {old_version}')
          index_path.write_text(index.replace(old_version, new_version, 1), encoding='utf-8')
          PY

          rm .github/workflows/temp-fix-mymaps-link.yml
          rm .tmp-mymaps-link-trigger

      - name: Commit My Maps link fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Open My Maps without Google Maps app redirect'
          git push origin HEAD:agent/ui-overhaul-02-kmz-complete
