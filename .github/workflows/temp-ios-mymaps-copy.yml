name: Temporary iOS My Maps copy

on:
  push:
    branches:
      - agent/ui-overhaul-02-kmz-complete

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run iOS My Maps copy patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-overhaul-02-kmz-complete

      - name: Patch My Maps behavior on iOS
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('js/main.js')
          main = main_path.read_text(encoding='utf-8')

          old = '''function openGoogleMyMaps() {

  setWorkflowStep("mymaps");

  window.open(
    "https://mymaps.google.com/",
    "_blank"
  );
}
'''

          new = '''function isIosMyMapsDevice() {
  return (
    /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (
      navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1
    )
  );
}

async function copyTextForMyMaps(text) {
  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly", "");
  textarea.style.position = "fixed";
  textarea.style.opacity = "0";
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  textarea.remove();
}

async function openGoogleMyMaps() {
  setWorkflowStep("mymaps");

  const myMapsUrl =
    "https://www.google.com/maps/d/u/0/";

  if (isIosMyMapsDevice()) {
    try {
      await copyTextForMyMaps(myMapsUrl);

      alert(
        "My MapsのURLをコピーしました。\\n\\n" +
        "Safariのアドレスバーへ貼り付けて開いてください。\\n" +
        "リンクを直接押すと、Google Mapsアプリが開く場合があります。"
      );
    } catch (error) {
      prompt(
        "下のURLをコピーし、Safariのアドレスバーへ貼り付けてください。",
        myMapsUrl
      );
    }

    return;
  }

  window.open(
    myMapsUrl,
    "_blank",
    "noopener"
  );
}
'''

          if old not in main:
              raise SystemExit('Expected openGoogleMyMaps block not found')

          main_path.write_text(main.replace(old, new, 1), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = 'js/main.js?v=7'
          new_version = 'js/main.js?v=8'

          if old_version not in index:
              raise SystemExit('Expected main.js cache version not found')

          index_path.write_text(
              index.replace(old_version, new_version, 1),
              encoding='utf-8'
          )
          PY

          rm .github/workflows/temp-ios-mymaps-copy.yml
          rm .tmp-ios-mymaps-copy-trigger

      - name: Commit iOS My Maps copy behavior
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Copy My Maps URL on iPhone and iPad'
          git push origin HEAD:agent/ui-overhaul-02-kmz-complete
