name: Noah N4 Signed QA Offline Audit (HOLD)

on:
  pull_request:
    branches:
      - qa/n4-android-device-testkit-20261019
    paths:
      - 'scripts/audit-n4-android-signed-qa.mjs'
      - 'scripts/check-n4-android-signed-qa-audit.mjs'
      - 'docs/n4-android-amo-signing-acceptance-2026-10-21.md'
      - '.github/workflows/noah-n4-signed-qa-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated QA candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify offline scripts syntax
        run: |
          node --check scripts/audit-n4-android-signed-qa.mjs
          node --check scripts/check-n4-android-signed-qa-audit.mjs
      - name: Exercise structural audit and fail-closed negative cases
        run: node scripts/check-n4-android-signed-qa-audit.mjs
      - name: Confirm signed public 0.3.5 remains unchanged
        run: |
          echo 'f5c7d300c6cdd82758f88f651116c1b7af42863ef03e80f8ac89e39afa0fa7b7  downloads/campsite-bridge-android-0.3.5.xpi' | sha256sum -c -
      - name: No signing, no AMO submission, no release
        run: echo 'HOLD - this CI tests synthetic archives only; Mozilla signature and real Android remain NOT TESTED.'
