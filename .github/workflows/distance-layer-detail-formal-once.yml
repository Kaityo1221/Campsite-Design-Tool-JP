name: Distance layer detail formal once

on:
  push:
    branches:
      - hotfix/distance-layer-warning-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/distance-layer-warning-ui
      - name: Align hidden layer examples with formal names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/distance-entry.js')
          s = p.read_text(encoding='utf-8')
          old = '例：既存ポケストップ、既存ジム、追加ポケストップ、追加パワースポット'
          new = '正式名称：既存 PokéStop、既存 Gym、既存 PowerSpot、新規 PokéStop、新規 Gym、新規 PowerSpot'
          if old not in s:
              raise SystemExit('old detail example not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'js/distance-entry.js?v=4' not in s:
              raise SystemExit('distance-entry cache v4 not found')
          p.write_text(s.replace('js/distance-entry.js?v=4', 'js/distance-entry.js?v=5'), encoding='utf-8')
          PY
          node --check js/distance-entry.js
          grep -q '正式名称：既存 PokéStop' js/distance-entry.js
          grep -q 'js/distance-entry.js?v=5' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/distance-entry.js index.html
          git commit -m 'Align distance layer detail with formal names'
          git push origin HEAD:hotfix/distance-layer-warning-ui
