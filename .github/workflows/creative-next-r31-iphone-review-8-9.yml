name: Creative Next r31 iPhone review 8-9
on:
  push:
    branches:
      - fix/creative-next-r31-iphone-review-8-9-20261012
    paths:
      - 'creative-next/original-ui-r31-b3-b4/**'
      - 'creative-next/phase-1b/core/activity-areas.mjs'
      - 'creative-next/phase-1b/core/export-kmz.mjs'
      - 'creative-next/phase-1b/integration/isolated-editor-session.mjs'
      - 'creative-next/qa/r31-review-7/**'
      - '.github/workflows/creative-next-r31-iphone-review-8-9.yml'
  pull_request:
    branches:
      - fix/creative-next-r31-iphone-review-7-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned QA dependencies
        run: npm install --prefix creative-next --no-save --no-package-lock --ignore-scripts jszip@3.10.1 @xmldom/xmldom@0.9.8 acorn@8.15.0 leaflet@1.9.4 pngjs@7.0.0 playwright@1.56.0
      - name: Syntax checks
        run: |
          node --check creative-next/original-ui-r31-b3-b4/ui-runtime.mjs
          node --check creative-next/original-ui-r31-b3-b4/bootstrap.mjs
          node --check creative-next/original-ui-r31-b3-b4/adapter-review.mjs
          node --check creative-next/phase-1b/core/activity-areas.mjs
          node --check creative-next/phase-1b/core/export-kmz.mjs
          node --check creative-next/phase-1b/integration/isolated-editor-session.mjs
      - name: Atomic redraw and safe KMZ tests
        run: node --test creative-next/qa/r31-review-7/review.test.mjs
      - name: Original engine and B1/B2 compatibility regression
        run: |
          node --test creative-next/qa/r31-b2/adapter.test.mjs creative-next/qa/r31-b2/b1-compatible.test.mjs creative-next/qa/r31-b3-b4/workspace.test.mjs creative-next/phase-1b/test/stage-kmz.test.mjs creative-next/phase-1b/test/export-kmz.test.mjs creative-next/phase-1b/test/legacy-reversed-circle.test.mjs creative-next/phase-1b/test/legacy-kasai-convert.test.mjs creative-next/phase-1b/test/dependent-circles.test.mjs creative-next/phase-1b/test/activity-membership.test.mjs creative-next/phase-1b/test/journal-save.test.mjs creative-next/phase-1b/test/journal-web-locks.test.mjs creative-next/phase-1b/test/journal-explicit-recovery.test.mjs creative-next/phase-1b/test/isolated-editor-session.test.mjs
      - name: Install headless Chromium
        run: creative-next/node_modules/.bin/playwright install --with-deps chromium
      - name: iPhone-size browser interaction tests
        run: node creative-next/qa/r31-review-7/browser.cjs
# No deployment or write to main, frozen branches, old previews or production data.
