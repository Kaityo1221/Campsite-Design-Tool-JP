name: Creative Next Command Boundary
on:
  push:
    branches: [feature/creative-next-ui-exact-parity-20261010]
    paths:
      - 'creative-next/integration/creative-next-command-boundary.mjs'
      - 'creative-next/qa/creative-next-command-boundary.test.mjs'
      - '.github/workflows/creative-next-command-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node creative-next/qa/current-creative-ui-source-parity.cjs
      - run: node creative-next/qa/creative-next-command-boundary.test.mjs
      - run: node creative-next/qa/creative-next-original-leaflet-overlay.test.mjs
