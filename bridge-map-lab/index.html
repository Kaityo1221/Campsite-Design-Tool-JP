<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Campsite Bridge Map LAB</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#e5eefc}
    body{display:grid;place-items:center;padding:24px}
    main{width:min(720px,100%);padding:28px;border:1px solid #334155;border-radius:20px;background:#111827;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#7f1d1d;color:#fee2e2;font-size:12px;font-weight:800;letter-spacing:.08em}
    h1{margin:16px 0 8px;font-size:clamp(28px,7vw,46px);line-height:1.05}
    p{margin:0;color:#b8c5d9;line-height:1.8}
    .status{margin-top:24px;padding:16px;border:1px solid #334155;border-radius:14px;background:#0f172a}
    .status strong{display:block;margin-bottom:6px;color:#dbeafe}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#bfdbfe}
  </style>
</head>
<body>
  <main>
    <span class="badge">LAB ONLY</span>
    <h1>Campsite Bridge Map LAB</h1>
    <p>次世代Campsite Bridgeの実験専用ページです。本番Creative Modeとは分離されています。</p>
    <div class="status">
      <strong>Phase 2: LAB shell</strong>
      <p>Map、Bridge通信、WFMM連携、localStorage、XHR / fetch監視はまだ実装していません。</p>
      <p>Branch: <code>bridge-map-lab</code></p>
    </div>
  </main>
</body>
</html>
