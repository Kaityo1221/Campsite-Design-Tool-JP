<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Phase 5-D8 Unified Visible Parity</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--cm-blue:#1677ff;--cm-red:#ef4444;--cm-purple:#8b35e8;--cm-pink:#f3a8c9;--cm-orange:#ff8418}
    html,body{margin:0;background:#16130f;color:#f8f2e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:18px}.card{margin:12px 0;padding:14px;border:1px solid #5f533d;border-radius:14px;background:#211d17}
    #map{height:250px;border-radius:12px;overflow:hidden}.pass{color:#a8e6a1}.fail{color:#ffaaa0}.row{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid #8d784f;background:#f6e6ba;color:#2b2419;font-weight:800}
    .cm-v45-map-icon{background:transparent!important;border:0!important;pointer-events:none!important}.cm-v45-poi{width:30px;height:30px;display:grid;place-items:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.26))}.cm-v45-icon-wrap{position:relative;width:36px;height:36px;display:grid;place-items:center}
    .cm-v45-stop{width:19px;height:19px;border-radius:50%;background:var(--cm-blue);border:3px solid #fff;box-shadow:0 0 0 2px #0b5ed7}
    .cm-v45-gym{position:relative;width:25px;height:25px;display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:#fff}.cm-v45-gym:after{content:"";width:20px;height:20px;clip-path:inherit;background:var(--cm-red)}
    .cm-v45-power,.cm-v45-inactive{width:21px;height:21px;transform:rotate(45deg);border:3px solid #fff;border-radius:3px}.cm-v45-power{background:var(--cm-purple);box-shadow:0 0 0 2px #681fc1}.cm-v45-inactive{background:var(--cm-pink);box-shadow:0 0 0 2px #e879aa;opacity:.68}
    .cm-v45-candidate{position:relative;width:25px;height:25px;transform:rotate(-45deg);border:3px solid #fff;border-radius:50% 50% 50% 0;background:var(--cm-orange);box-shadow:0 2px 7px rgba(0,0,0,.25)}.cm-v45-candidate:after{content:"✓";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);color:#fff;font-size:14px;font-weight:1000}
  </style>
</head>
<body>
<main>
  <h1>Phase 5-D8 Unified Visible Parity</h1>
  <p>Existing POIとCandidateを新Rendererだけで可視化し、現行Creative Modeのアイコン形状・円・keyed再利用を検証します。</p>
  <div class="card"><div id="map"></div></div>
  <div class="card"><button id="run">テスト実行</button> <strong id="summary">未実行</strong></div>
  <div class="card" id="results"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../creative/runtime/map-engine/existing-records-adapter.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/existing-records-refresh-store.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/existing-geometry.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/candidate-records-adapter.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/candidate-records-refresh-store.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/candidate-geometry.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/scene-builder.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/candidate-scene-builder.js?v=5d8"></script>
<script src="../creative/runtime/map-engine/map-renderer.js?v=5d8"></script>
<script>
(() => {
  const results=document.getElementById('results'),summary=document.getElementById('summary');
  let map=null,renderer=null;
  function equal(actual,expected,label){if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error((label||'value')+' expected '+JSON.stringify(expected)+' got '+JSON.stringify(actual))}
  function check(name,fn){const row=document.createElement('div');row.className='row';try{fn();row.classList.add('pass');row.textContent='✅ '+name;return true}catch(error){row.classList.add('fail');row.textContent='❌ '+name+' — '+(error?.message||error);return false}finally{results.appendChild(row)}}
  function diagnostic(key){return renderer.getDiagnostics().find(x=>x.key===key)}
  function markerId(key){return diagnostic(key)?.leafletId}
  function shapeCount(selector){return map.getContainer().querySelectorAll(selector).length}
  function circleId(radius,key){return renderer.getCircleDiagnostics(radius).find(x=>x.key===key)?.leafletId}
  function resetMap(){try{renderer?.destroy?.()}catch{}try{map?.remove?.()}catch{}document.getElementById('map').replaceChildren();map=L.map('map',{zoomControl:false,attributionControl:false}).setView([35.6818,139.7678],17)}

  document.getElementById('run').onclick=()=>{
    results.replaceChildren();resetMap();let passed=0,total=0;
    let records=[
      {id:'e-stop',guid:'guid-stop',layer:'existing-pokestop',latlng:[35.68140,139.76720],gameStatus:'ACTIVE',deleted:false},
      {id:'e-gym',guid:'guid-gym',layer:'existing-gym',latlng:[35.68170,139.76760],gameStatus:'ACTIVE',deleted:false},
      {id:'e-power',guid:'guid-power',layer:'existing-power',latlng:[35.68200,139.76800],gameStatus:'ACTIVE',deleted:false},
      {id:'e-inactive',guid:'guid-inactive',layer:'existing-power',latlng:[35.68230,139.76840],gameStatus:'INACTIVE',deleted:false},
      {id:'c-stop',layer:'new-pokestop',latlng:[35.68260,139.76880],deleted:false}
    ];
    const existingStore=window.bridgeMapLab_createExistingRecordsRefreshStore(()=>records);
    const candidateStore=window.bridgeMapLab_createCandidateRecordsRefreshStore(()=>records);
    renderer=window.bridgeMapLab_createMapRenderer(map,{opacity:1});
    let display={circleRadiiVisible:[50,40,30],candidateTypesVisible:{'new-pokestop':true,'new-gym':true,'new-power':true},existingTypesVisible:{'existing-pokestop':true,'existing-gym':true,'existing-power':true}};
    const render=()=>{const existing=existingStore.list(),eg=window.bridgeMapLab_buildExistingGeometry(existing),cg=window.bridgeMapLab_buildCandidateGeometry(candidateStore.list());renderer.render(window.bridgeMapLab_buildSceneWithCandidates({pois:existing},eg,cg,display))};
    render();
    const run=(name,fn)=>{total++;if(check(name,fn))passed++};

    run('Unified visible renders 5 markers',()=>equal(renderer.getRenderedCounts().markers,5));
    run('Existing markers use div-icon renderer',()=>equal(renderer.getDiagnostics().filter(x=>x.ownerKey.startsWith('poi:')).every(x=>x.markerKind==='existing-icon'),true));
    run('Candidate keeps candidate-pin renderer',()=>equal(diagnostic('marker:candidate:c-stop')?.markerKind,'candidate-pin'));
    run('PokéStop uses blue round shape class',()=>equal(shapeCount('.cm-engine-existing-icon .cm-v45-stop'),1));
    run('Gym uses red hex shape class',()=>equal(shapeCount('.cm-engine-existing-icon .cm-v45-gym'),1));
    run('active Power Spot uses purple diamond shape class',()=>equal(shapeCount('.cm-engine-existing-icon .cm-v45-power'),1));
    run('inactive Power Spot uses pale pink diamond shape class',()=>equal(shapeCount('.cm-engine-existing-icon .cm-v45-inactive'),1));
    run('Candidate uses orange pin shape class',()=>equal(shapeCount('.cm-engine-candidate-icon .cm-v45-candidate'),1));
    run('all marker opacities are visible',()=>equal(renderer.getDiagnostics().every(x=>x.opacity===1),true));
    run('50m circles render for all five',()=>equal(renderer.getRenderedCounts().circles50,5));
    run('40m circles render for all five',()=>equal(renderer.getRenderedCounts().circles40,5));
    run('30m circles render for all five',()=>equal(renderer.getRenderedCounts().circles30,5));

    const powerId=markerId('marker:poi:guid-power');
    const power50Id=circleId(50,'circle50:poi:guid-power');
    records[2].gameStatus='INACTIVE';existingStore.refresh();render();
    run('active-to-inactive state change reuses marker Leaflet ID',()=>equal(markerId('marker:poi:guid-power'),powerId));
    run('active-to-inactive swaps visual class to inactive',()=>equal(shapeCount('.cm-engine-existing-icon .cm-v45-inactive'),2));
    run('state change keeps 50m circle Leaflet ID',()=>equal(circleId(50,'circle50:poi:guid-power'),power50Id));

    const stopId=markerId('marker:poi:guid-stop');
    const candidateId=markerId('marker:candidate:c-stop');
    display={...display,existingTypesVisible:{'existing-pokestop':true,'existing-gym':false,'existing-power':true}};render();
    run('existing layer toggle removes Gym only',()=>equal(renderer.getRenderedCounts().markers,4));
    run('existing PokéStop ID survives layer toggle',()=>equal(markerId('marker:poi:guid-stop'),stopId));
    run('Candidate ID survives existing layer toggle',()=>equal(markerId('marker:candidate:c-stop'),candidateId));

    display={...display,circleRadiiVisible:[50,30]};render();
    run('40m layer toggle removes all 40m circles',()=>equal(renderer.getRenderedCounts().circles40,0));
    run('50m circles remain after 40m toggle',()=>equal(renderer.getRenderedCounts().circles50,4));
    run('30m circles remain after 40m toggle',()=>equal(renderer.getRenderedCounts().circles30,4));

    summary.textContent=passed+' / '+total+(passed===total?' PASS':' FAIL');summary.className=passed===total?'pass':'fail';window.__unifiedVisibleParity={passed,total};
  };
})();
</script>
</body>
</html>
