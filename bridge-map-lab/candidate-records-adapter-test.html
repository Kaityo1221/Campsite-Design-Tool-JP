<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Phase 5-C2 Records Adapter</title>
  <script src="candidate-records-adapter.js?v=5c2" defer></script>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1118;color:#e8edf3}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#0b1118}.shell{width:min(860px,100%);margin:0 auto;padding:24px}.eyebrow{margin:0 0 6px;color:#ff9f7a;font-size:12px;font-weight:800;letter-spacing:.08em}h1{margin:0;font-size:28px;line-height:1.2}.scope{margin:10px 0 20px;color:#aeb9c6;font-size:13px;line-height:1.6}.summary,.tests{border:1px solid #34404d;border-radius:10px;background:#111922}.summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;margin-bottom:14px}.result{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:800}.pass{color:#78d6a0}.fail{color:#ff8f86}.wait{color:#aeb9c6}button{appearance:none;border:1px solid #52606e;border-radius:8px;background:#17212b;color:#edf3f8;padding:9px 12px;font:inherit;font-weight:700}.row{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:14px 16px;border-top:1px solid #2c3743;font-size:13px;line-height:1.5}.row:first-child{border-top:0}.status{font-weight:900}.details{color:#dfe7ee}@media(max-width:560px){.shell{padding:16px}.row{grid-template-columns:92px 1fr;gap:10px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">LAB ONLY</p>
    <h1>Phase 5-C2 Records Adapter</h1>
    <p class="scope">Creative Modeのrecordsを読み取り、new-pokestop / new-gym / new-powerだけを最小Candidateへ変換します。records本体、existing-*、project.addedPois、Geometry、Scene、Rendererは変更しません。</p>
    <section class="summary"><p id="summary" class="result wait">C2 WAIT</p><button id="rerun" type="button">再テスト</button></section>
    <section id="tests" class="tests"></section>
  </main>
  <script>
    (()=>{
      'use strict';
      const testsElement=document.getElementById('tests');
      const summaryElement=document.getElementById('summary');

      function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
      function clone(value){return JSON.parse(JSON.stringify(value))}
      function row(ok,name,detail=''){
        const el=document.createElement('div');el.className='row';
        const s=document.createElement('div');s.className=`status ${ok?'pass':'fail'}`;s.textContent=ok?'PASS':'FAIL';
        const d=document.createElement('div');d.className='details';d.textContent=detail?`${name} — ${detail}`:name;
        el.append(s,d);return el;
      }
      function run(){
        const results=[];
        const check=(name,fn)=>{try{fn();results.push({ok:true,name})}catch(error){results.push({ok:false,name,detail:error?.message||String(error)})}};
        const adapt=window.bridgeMapLab_adaptCreativeCandidateRecords;
        if(typeof adapt!=='function'){
          summaryElement.className='result fail';summaryElement.textContent='C2 FAIL 0/0';testsElement.replaceChildren(row(false,'Adapter load','function not found'));return;
        }

        check('empty records produce empty candidates',()=>{const r=adapt([]);if(r.candidates.length!==0||r.diagnostics.length!==0)throw new Error('not empty')});
        check('new-pokestop maps to minimal Candidate',()=>{const r=adapt([{id:'a',layer:'new-pokestop',latlng:[35,139],deleted:false,title:'x'}]);if(!same(r.candidates,[{id:'a',lat:35,lng:139,candidateType:'new-pokestop'}]))throw new Error(JSON.stringify(r.candidates))});
        check('new-gym maps correctly',()=>{const r=adapt([{id:'g',layer:'new-gym',latlng:[35.1,139.1]}]);if(r.candidates[0]?.candidateType!=='new-gym')throw new Error('type mismatch')});
        check('new-power maps correctly',()=>{const r=adapt([{id:'p',layer:'new-power',latlng:[35.2,139.2]}]);if(r.candidates[0]?.candidateType!=='new-power')throw new Error('type mismatch')});
        check('existing-* records are ignored',()=>{const r=adapt([{id:'e1',layer:'existing-pokestop',latlng:[0,0]},{id:'e2',layer:'existing-gym',latlng:[0,0]},{id:'e3',layer:'existing-power',latlng:[0,0]}]);if(r.candidates.length!==0||r.counts.ignoredExisting!==3)throw new Error(JSON.stringify(r.counts))});
        check('deleted Candidate records are ignored',()=>{const r=adapt([{id:'d',layer:'new-pokestop',latlng:[35,139],deleted:true}]);if(r.candidates.length!==0||r.counts.ignoredDeleted!==1||r.diagnostics.length!==0)throw new Error(JSON.stringify(r))});
        check('Candidate output contains only id/lat/lng/candidateType',()=>{const r=adapt([{id:'a',layer:'new-pokestop',latlng:[35,139],title:'title',memo:'memo',source:true}]);const keys=Object.keys(r.candidates[0]).sort();if(!same(keys,['candidateType','id','lat','lng']))throw new Error(keys.join(','))});
        check('returned Candidate does not share record fields',()=>{const source={id:'a',layer:'new-pokestop',latlng:[35,139]};const r=adapt([source]);r.candidates[0].lat=1;if(source.latlng[0]!==35)throw new Error('source changed')});
        check('Adapter does not mutate records',()=>{const source=[{id:'a',layer:'new-pokestop',latlng:[35,139],deleted:false},{id:'e',layer:'existing-gym',latlng:[36,140]}];const before=clone(source);adapt(source);if(!same(source,before))throw new Error('records mutated')});
        check('missing id is excluded with diagnostic',()=>{const r=adapt([{layer:'new-pokestop',latlng:[35,139]}]);if(r.candidates.length!==0||r.diagnostics[0]?.code!=='INVALID_ID')throw new Error(JSON.stringify(r.diagnostics))});
        check('invalid latlng shape is excluded',()=>{const r=adapt([{id:'a',layer:'new-pokestop',latlng:null}]);if(r.diagnostics[0]?.code!=='INVALID_LATLNG')throw new Error(JSON.stringify(r.diagnostics))});
        check('invalid latitude is excluded',()=>{const r=adapt([{id:'a',layer:'new-pokestop',latlng:[91,139]}]);if(r.diagnostics[0]?.code!=='INVALID_LATITUDE')throw new Error(JSON.stringify(r.diagnostics))});
        check('invalid longitude is excluded',()=>{const r=adapt([{id:'a',layer:'new-pokestop',latlng:[35,181]}]);if(r.diagnostics[0]?.code!=='INVALID_LONGITUDE')throw new Error(JSON.stringify(r.diagnostics))});
        check('unknown new-* type is diagnosed and excluded',()=>{const r=adapt([{id:'a',layer:'new-portal',latlng:[35,139]}]);if(r.diagnostics[0]?.code!=='UNKNOWN_CANDIDATE_TYPE'||r.candidates.length!==0)throw new Error(JSON.stringify(r))});
        check('duplicate id keeps first valid Candidate and diagnoses later duplicate',()=>{const r=adapt([{id:'dup',layer:'new-pokestop',latlng:[35,139]},{id:'dup',layer:'new-gym',latlng:[36,140]}]);if(r.candidates.length!==1||r.candidates[0].candidateType!=='new-pokestop'||r.diagnostics[0]?.code!=='DUPLICATE_ID')throw new Error(JSON.stringify(r))});
        check('one invalid Candidate does not stop valid Candidates',()=>{const r=adapt([{id:'ok1',layer:'new-pokestop',latlng:[35,139]},{id:'bad',layer:'new-gym',latlng:[999,139]},{id:'ok2',layer:'new-power',latlng:[36,140]}]);if(r.candidates.length!==2||r.diagnostics.length!==1)throw new Error(JSON.stringify(r.counts))});
        check('non-array records input is rejected',()=>{let threw=false;try{adapt(null)}catch{threw=true}if(!threw)throw new Error('did not throw')});

        testsElement.replaceChildren(...results.map(x=>row(x.ok,x.name,x.detail||'')));
        const passed=results.filter(x=>x.ok).length;
        const ok=passed===results.length;
        summaryElement.className=`result ${ok?'pass':'fail'}`;
        summaryElement.textContent=`C2 ${ok?'PASS':'FAIL'} ${passed}/${results.length}`;
      }
      document.getElementById('rerun').addEventListener('click',run);
      document.addEventListener('DOMContentLoaded',run,{once:true});
    })();
  </script>
</body>
</html>
