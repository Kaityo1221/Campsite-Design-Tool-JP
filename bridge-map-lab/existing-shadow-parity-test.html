<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Phase 5-D7 Existing POI Shadow Parity</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body{margin:0;background:#16130f;color:#f8f2e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:18px}.card{margin:12px 0;padding:14px;border:1px solid #5f533d;border-radius:14px;background:#211d17}
    #map{height:220px;border-radius:12px;overflow:hidden}.pass{color:#a8e6a1}.fail{color:#ffaaa0}.row{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid #8d784f;background:#f6e6ba;color:#2b2419;font-weight:800}
  </style>
</head>
<body>
<main>
  <h1>Phase 5-D7 Existing POI Shadow Parity</h1>
  <p>existing-* と Candidate を同一Unified Sceneへ入れ、透明Rendererでもkeyed再利用契約が維持されることを検証します。</p>
  <div class="card"><div id="map"></div></div>
  <div class="card"><button id="run">テスト実行</button> <strong id="summary">未実行</strong></div>
  <div class="card" id="results"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../creative/runtime/map-engine/existing-records-adapter.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/existing-records-refresh-store.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/existing-geometry.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/candidate-records-adapter.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/candidate-records-refresh-store.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/candidate-geometry.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/scene-builder.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/candidate-scene-builder.js?v=5d4"></script>
<script src="../creative/runtime/map-engine/map-renderer.js?v=5d4"></script>
<script>
(() => {
  const results=document.getElementById('results'),summary=document.getElementById('summary');
  let map=null,renderer=null;
  function check(name,fn){const row=document.createElement('div');row.className='row';try{fn();row.classList.add('pass');row.textContent='✅ '+name;return true}catch(error){row.classList.add('fail');row.textContent='❌ '+name+' — '+(error?.message||error);return false}finally{results.appendChild(row)}}
  function equal(actual,expected,label){if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error((label||'value')+' expected '+JSON.stringify(expected)+' got '+JSON.stringify(actual))}
  function marker(key){return renderer.getDiagnostics().find(x=>x.key===key)}
  function markerId(key){return marker(key)?.leafletId}
  function coords(key){const d=marker(key);return d?[Number(d.leafletLatLng.lat.toFixed(6)),Number(d.leafletLatLng.lng.toFixed(6))]:null}
  function resetMap(){try{renderer?.destroy?.()}catch{}try{map?.remove?.()}catch{}document.getElementById('map').replaceChildren();map=L.map('map',{zoomControl:false,attributionControl:false}).setView([35.6816,139.7675],17)}

  document.getElementById('run').onclick=()=>{
    results.replaceChildren();resetMap();let passed=0,total=0;
    let records=[
      {id:'e-stop',guid:'guid-stop',layer:'existing-pokestop',latlng:[35.68160,139.76750],gameStatus:'ACTIVE',deleted:false},
      {id:'e-gym',guid:'guid-gym',layer:'existing-gym',latlng:[35.68190,139.76790],gameStatus:'ACTIVE',deleted:false},
      {id:'e-power',guid:'guid-power',layer:'existing-power',latlng:[35.68220,139.76820],gameStatus:'ACTIVE',deleted:false},
      {id:'e-inactive',guid:'guid-inactive',layer:'existing-power',latlng:[35.68250,139.76850],gameStatus:'INACTIVE',deleted:false},
      {id:'c-stop',layer:'new-pokestop',latlng:[35.68280,139.76880],deleted:false},
      {id:'e-deleted',guid:'guid-deleted',layer:'existing-pokestop',latlng:[35.68310,139.76910],deleted:true},
      {id:'e-bad',guid:'guid-bad',layer:'existing-gym',latlng:['bad',139.76940],deleted:false}
    ];
    let display={circleRadiiVisible:[50,40,30],candidateTypesVisible:{'new-pokestop':true,'new-gym':true,'new-power':true},existingTypesVisible:{'existing-pokestop':true,'existing-gym':true,'existing-power':true}};
    const existingStore=window.bridgeMapLab_createExistingRecordsRefreshStore(()=>records);
    const candidateStore=window.bridgeMapLab_createCandidateRecordsRefreshStore(()=>records);
    renderer=window.bridgeMapLab_createMapRenderer(map,{opacity:0});
    const render=()=>{const existingPois=existingStore.list();const existingGeometry=window.bridgeMapLab_buildExistingGeometry(existingPois);const candidateGeometry=window.bridgeMapLab_buildCandidateGeometry(candidateStore.list());renderer.render(window.bridgeMapLab_buildSceneWithCandidates({pois:existingPois},existingGeometry,candidateGeometry,display))};
    render();
    const run=(name,fn)=>{total++;if(check(name,fn))passed++};

    run('existing adapter outputs 4 active records',()=>equal(existingStore.getCounts().output,4));
    run('candidate adapter still outputs only Candidate',()=>equal(candidateStore.getCounts().output,1));
    run('deleted existing record is ignored',()=>equal(existingStore.getCounts().ignoredDeleted,1));
    run('invalid existing record is isolated',()=>{if(!existingStore.getDiagnostics().some(x=>x.guid==='guid-bad'&&x.code==='INVALID_LATITUDE'))throw new Error('diagnostic not found')});
    run('Unified Scene renders 4 existing + 1 candidate markers',()=>equal(renderer.getRenderedCounts().markers,5));
    run('Unified Scene renders all 50m circles',()=>equal(renderer.getRenderedCounts().circles50,5));
    run('Unified Scene renders all 40m circles',()=>equal(renderer.getRenderedCounts().circles40,5));
    run('Unified Scene renders all 30m circles',()=>equal(renderer.getRenderedCounts().circles30,5));
    run('existing PokéStop keeps POKESTOP renderKind',()=>equal(marker('marker:poi:guid-stop')?.renderKind,'POKESTOP'));
    run('existing Gym keeps GYM renderKind',()=>equal(marker('marker:poi:guid-gym')?.renderKind,'GYM'));
    run('existing active Power Spot keeps POWERSPOT renderKind',()=>equal(marker('marker:poi:guid-power')?.renderKind,'POWERSPOT'));
    run('inactive Power Spot becomes INACTIVE_POWERSPOT',()=>equal(marker('marker:poi:guid-inactive')?.renderKind,'INACTIVE_POWERSPOT'));
    run('shadow marker opacity is zero',()=>equal(marker('marker:poi:guid-stop')?.opacity,0));

    const stopId=markerId('marker:poi:guid-stop');
    const candidateId=markerId('marker:candidate:c-stop');
    display={...display,existingTypesVisible:{'existing-pokestop':true,'existing-gym':false,'existing-power':true}};render();
    run('hiding existing-gym removes only existing Gym',()=>equal(renderer.getRenderedCounts().markers,4));
    run('existing PokéStop Leaflet ID survives layer toggle',()=>equal(markerId('marker:poi:guid-stop'),stopId));
    run('Candidate Leaflet ID survives existing layer toggle',()=>equal(markerId('marker:candidate:c-stop'),candidateId));

    display={...display,existingTypesVisible:{'existing-pokestop':true,'existing-gym':false,'existing-power':false}};render();
    run('hiding existing-power removes active and inactive Power Spots',()=>equal(renderer.getRenderedCounts().markers,2));
    run('Candidate remains in Unified Scene',()=>equal(markerId('marker:candidate:c-stop'),candidateId));

    records[0].latlng=[35.68350,139.76950];existingStore.refresh();render();
    run('existing move updates coordinates',()=>equal(coords('marker:poi:guid-stop'),[35.6835,139.7695]));
    run('existing move reuses Leaflet marker ID',()=>equal(markerId('marker:poi:guid-stop'),stopId));

    records[0].deleted=true;existingStore.refresh();render();
    run('existing deleted:true removes its marker',()=>equal(renderer.getRenderedCounts().markers,1));
    run('candidate remains after existing deletion',()=>equal(markerId('marker:candidate:c-stop'),candidateId));

    summary.textContent=passed+' / '+total+(passed===total?' PASS':' FAIL');summary.className=passed===total?'pass':'fail';window.__existingShadowParity={passed,total};
  };
})();
</script>
</body>
</html>
