<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Phase 5-D9 Unified Interaction Parity</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--cm-blue:#1677ff;--cm-red:#ef4444;--cm-purple:#8b35e8;--cm-pink:#f3a8c9;--cm-orange:#ff8418}
    html,body{margin:0;background:#16130f;color:#f8f2e5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:18px}.card{margin:12px 0;padding:14px;border:1px solid #5f533d;border-radius:14px;background:#211d17}
    #map{height:250px;border-radius:12px;overflow:hidden}.pass{color:#a8e6a1}.fail{color:#ffaaa0}.row{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid #8d784f;background:#f6e6ba;color:#2b2419;font-weight:800}
    .cm-v45-map-icon{background:transparent!important;border:0!important}.cm-v45-poi{width:30px;height:30px;display:grid;place-items:center}.cm-v45-icon-wrap{width:36px;height:36px;display:grid;place-items:center}
    .cm-v45-stop{width:19px;height:19px;border-radius:50%;background:var(--cm-blue);border:3px solid #fff;box-shadow:0 0 0 2px #0b5ed7}
    .cm-v45-candidate{position:relative;width:25px;height:25px;transform:rotate(-45deg);border:3px solid #fff;border-radius:50% 50% 50% 0;background:var(--cm-orange)}
    .cm-v45-candidate:after{content:"✓";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);color:#fff;font-size:14px;font-weight:1000}
  </style>
</head>
<body>
<main>
  <h1>Phase 5-D9 Unified Interaction Parity</h1>
  <p>新RendererのMarkerタップを既存Creative Modeへ委譲するためのactivation contractを実Leafletで検証します。</p>
  <div class="card"><div id="map"></div></div>
  <div class="card"><button id="run">テスト実行</button> <strong id="summary">未実行</strong></div>
  <div class="card" id="results"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../creative/runtime/map-engine/existing-records-adapter.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/existing-records-refresh-store.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/existing-geometry.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/candidate-records-adapter.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/candidate-records-refresh-store.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/candidate-geometry.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/scene-builder.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/candidate-scene-builder.js?v=5d9"></script>
<script src="../creative/runtime/map-engine/map-renderer.js?v=5d9"></script>
<script>
(() => {
  const results=document.getElementById('results'),summary=document.getElementById('summary');
  let map=null,renderer=null;
  function equal(actual,expected,label){if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error((label||'value')+' expected '+JSON.stringify(expected)+' got '+JSON.stringify(actual))}
  function check(name,fn){const row=document.createElement('div');row.className='row';try{fn();row.classList.add('pass');row.textContent='✅ '+name;return true}catch(error){row.classList.add('fail');row.textContent='❌ '+name+' — '+(error?.message||error);return false}finally{results.appendChild(row)}}
  function markerId(key){return renderer.getDiagnostics().find(x=>x.key===key)?.leafletId}
  function resetMap(){try{renderer?.destroy?.()}catch{}try{map?.remove?.()}catch{}document.getElementById('map').replaceChildren();map=L.map('map',{zoomControl:false,attributionControl:false}).setView([35.6818,139.7678],17)}

  document.getElementById('run').onclick=()=>{
    results.replaceChildren();resetMap();let passed=0,total=0;
    let records=[
      {id:'e-stop',guid:'guid-stop',layer:'existing-pokestop',latlng:[35.6815,139.7674],gameStatus:'ACTIVE',deleted:false},
      {id:'c-stop',layer:'new-pokestop',latlng:[35.6820,139.7680],deleted:false}
    ];
    const existingStore=window.bridgeMapLab_createExistingRecordsRefreshStore(()=>records);
    const candidateStore=window.bridgeMapLab_createCandidateRecordsRefreshStore(()=>records);
    const activations=[];
    renderer=window.bridgeMapLab_createMapRenderer(map,{opacity:1,onMarkerActivate:(item,event)=>activations.push({key:item.key,ownerKey:item.ownerKey,origin:item.origin,eventType:event?.type||''})});
    const render=()=>{const existing=existingStore.list(),eg=window.bridgeMapLab_buildExistingGeometry(existing),cg=window.bridgeMapLab_buildCandidateGeometry(candidateStore.list());renderer.render(window.bridgeMapLab_buildSceneWithCandidates({pois:existing},eg,cg,{circleRadiiVisible:[50],candidateTypesVisible:{'new-pokestop':true,'new-gym':true,'new-power':true},existingTypesVisible:{'existing-pokestop':true,'existing-gym':true,'existing-power':true}}))};
    render();
    const run=(name,fn)=>{total++;if(check(name,fn))passed++};

    run('both Unified markers render',()=>equal(renderer.getRenderedCounts().markers,2));
    run('both markers are interactive when callback is supplied',()=>equal(renderer.getDiagnostics().every(x=>x.interactive===true),true));
    run('existing marker exposes existing-icon renderer',()=>equal(renderer.getDiagnostics().find(x=>x.origin==='existing')?.markerKind,'existing-icon'));
    run('candidate marker exposes candidate-pin renderer',()=>equal(renderer.getDiagnostics().find(x=>x.origin==='candidate')?.markerKind,'candidate-pin'));

    const existingEl=map.getContainer().querySelector('.cm-engine-existing-icon');
    const candidateEl=map.getContainer().querySelector('.cm-engine-candidate-icon');
    existingEl.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
    candidateEl.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
    run('existing marker click emits activation',()=>equal(activations[0]?.origin,'existing'));
    run('existing activation keeps poi ownerKey',()=>equal(activations[0]?.ownerKey,'poi:guid-stop'));
    run('candidate marker click emits activation',()=>equal(activations[1]?.origin,'candidate'));
    run('candidate activation keeps candidate ownerKey',()=>equal(activations[1]?.ownerKey,'candidate:c-stop'));
    run('Leaflet click event is passed to activation callback',()=>equal(activations.every(x=>x.eventType==='click'),true));

    const existingId=markerId('marker:poi:guid-stop'),candidateId=markerId('marker:candidate:c-stop');
    records[0].latlng=[35.6830,139.7690];existingStore.refresh();render();
    run('existing move reuses interactive Marker ID',()=>equal(markerId('marker:poi:guid-stop'),existingId));
    run('candidate Marker ID remains stable during existing move',()=>equal(markerId('marker:candidate:c-stop'),candidateId));

    map.getContainer().querySelector('.cm-engine-existing-icon').dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
    run('reused existing marker still activates after rerender',()=>equal(activations.at(-1)?.ownerKey,'poi:guid-stop'));

    renderer.destroy();
    renderer=window.bridgeMapLab_createMapRenderer(map,{opacity:1});render();
    run('markers stay non-interactive when callback is absent',()=>equal(renderer.getDiagnostics().every(x=>x.interactive===false),true));

    summary.textContent=passed+' / '+total+(passed===total?' PASS':' FAIL');summary.className=passed===total?'pass':'fail';window.__unifiedInteractionParity={passed,total};
  };
})();
</script>
</body>
</html>
