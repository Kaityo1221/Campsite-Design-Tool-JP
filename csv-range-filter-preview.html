<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>CSV Range Filter Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020617}
    #preview{border:0;width:100%;height:100%;display:block}
    #banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483647;background:rgba(15,23,42,.94);color:#fde68a;border:1px solid #92400e;border-radius:999px;padding:7px 12px;font:700 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  </style>
</head>
<body>
  <div id="banner">🧪 開発用：CSV抽出範囲（暫定）</div>
  <iframe id="preview" src="index.html" title="Campsite Design Tool preview"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('preview');
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          if (!doc || doc.getElementById('csvRangeFilterTempLoader')) return;
          const script = doc.createElement('script');
          script.id = 'csvRangeFilterTempLoader';
          script.src = 'js/csv-range-filter-temp.js?v=1';
          doc.body.appendChild(script);
        } catch (error) {
          console.error('CSV range filter preview injection failed', error);
        }
      });
    })();
  </script>
</body>
</html>
