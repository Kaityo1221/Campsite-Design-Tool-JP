<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Campsite Bridge Handoff</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot strong{display:block;font-size:18px}.boot small{display:block;margin-top:8px;color:#94a3b8;line-height:1.7}
  </style>
</head>
<body>
  <div class="boot"><div><strong>🌉 Campsite Bridge</strong><small>受信したPOIをCampsite Design Toolへ渡しています…</small></div></div>
  <script>
  (() => {
    'use strict';

    const params = new URLSearchParams(location.search);
    const hasImportFlag = params.get('campsiteBridgeImport') === '1';
    let adapter = null;
    try {
      adapter = JSON.parse(sessionStorage.getItem('campsiteBridgeAdapter.v0.3') || 'null');
    } catch (_) {}

    if (!hasImportFlag || !Array.isArray(adapter?.pois) || adapter.pois.length === 0) {
      location.replace('./index.html');
      return;
    }

    fetch('./index.html', { cache:'no-store', credentials:'same-origin' })
      .then(response => {
        if (!response.ok) throw new Error(`index.html ${response.status}`);
        return response.text();
      })
      .then(html => {
        const leafletCss = '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">';
        const bridgeScripts = [
          '<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></' + 'script>',
          '<script src="js/bridge-entry.js?v=2"></' + 'script>',
          '<script src="js/bridge-selection.js?v=2"></' + 'script>'
        ].join('');

        let injected = html.includes('</head>')
          ? html.replace('</head>', `${leafletCss}</head>`)
          : `${leafletCss}${html}`;

        injected = injected.includes('</body>')
          ? injected.replace('</body>', `${bridgeScripts}</body>`)
          : `${injected}${bridgeScripts}`;

        document.open();
        document.write(injected);
        document.close();
      })
      .catch(error => {
        console.error('[Campsite Bridge] gateway boot failed', error);
        document.body.innerHTML = '<div class="boot"><div><strong>⚠️ Campsiteを読み込めませんでした</strong><small>ページを再読み込みしてください。</small></div></div>';
      });
  })();
  </script>
</body>
</html>
