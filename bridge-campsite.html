<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Campsite Bridge M5 Gateway</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot strong{display:block;font-size:18px}.boot small{display:block;margin-top:8px;color:#94a3b8;line-height:1.7}
  </style>
</head>
<body>
  <div class="boot"><div><strong>🌉 Campsite Bridge</strong><small>Campsite Design Toolへ受け渡しています…</small></div></div>
  <script>
  (() => {
    'use strict';

    const params = new URLSearchParams(location.search);
    if (params.get('campsiteBridgeDev') !== '1' || params.get('campsiteBridgeImport') !== '1') {
      document.body.innerHTML = '';
      return;
    }

    fetch('./index.html', { cache:'no-store', credentials:'same-origin' })
      .then(response => {
        if (!response.ok) throw new Error(`index.html ${response.status}`);
        return response.text();
      })
      .then(html => {
        const importScript = '<script src="js/bridge-import.js?v=1"><\\/script>';
        const injected = html.includes('</body>')
          ? html.replace('</body>', `${importScript}</body>`)
          : `${html}${importScript}`;

        document.open();
        document.write(injected);
        document.close();
      })
      .catch(error => {
        console.error('[Campsite Bridge M5] gateway boot failed', error);
        document.body.innerHTML = '<div class="boot"><div><strong>⚠️ Campsiteを読み込めませんでした</strong><small>ページを再読み込みしてください。</small></div></div>';
      });
  })();
  </script>
</body>
</html>
