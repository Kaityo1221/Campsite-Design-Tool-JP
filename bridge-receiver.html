<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Campsite Bridge Receiver</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #020617;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { display: none; }
    body.bridge-dev { display: block; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px; }
    .card {
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #0f172a;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .muted { color: #94a3b8; font-size: 13px; line-height: 1.7; }
    .status { margin: 18px 0; font-weight: 800; }
    .grid { display:grid; grid-template-columns:1fr auto; gap:8px 18px; }
    .grid strong { text-align:right; }
    .ok { color:#86efac; }
    .warn { color:#fde68a; }
    .error { color:#fca5a5; }
    button {
      margin-top: 18px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🌉 Campsite Bridge Receiver</h1>
      <div class="muted">開発検証専用。通常のCampsite Design Tool画面には表示されません。</div>
      <div id="status" class="status warn">Bridgeからのデータを待っています…</div>
      <div class="grid">
        <span>受信POI</span><strong id="total">0</strong>
        <span>PokéStop</span><strong id="pokestop">0</strong>
        <span>Gym</span><strong id="gym">0</strong>
        <span>Power Spot</span><strong id="powerspot">0</strong>
        <span>ACTIVE</span><strong id="active">0</strong>
        <span>INACTIVE</span><strong id="inactive">0</strong>
      </div>
      <button id="clearBtn" type="button">受信データを消去</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const DEV_PARAM = 'campsiteBridgeDev';
  const STORAGE_KEY = 'campsiteBridgePoC.v0.3';
  const ALLOWED_ENTITIES = new Set(['POKESTOP', 'GYM', 'POWERSPOT']);
  const ALLOWED_STATUSES = new Set(['ACTIVE', 'INACTIVE']);
  const params = new URLSearchParams(location.search);
  const isDev = params.get(DEV_PARAM) === '1';

  if (!isDev) {
    return;
  }

  document.body.classList.add('bridge-dev');

  const $ = id => document.getElementById(id);

  function normalizePoi(raw) {
    if (!raw || typeof raw !== 'object') return null;

    const guid = String(raw.guid || '').trim();
    const title = String(raw.title || raw.name || '').trim();
    const lat = Number(raw.lat);
    const lng = Number(raw.lng);
    const gameEntity = String(raw.gameEntity || raw.type || '').trim().toUpperCase();
    const gameStatus = String(raw.gameStatus || '').trim().toUpperCase();

    if (!guid || !Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    if (!ALLOWED_ENTITIES.has(gameEntity)) return null;
    if (!ALLOWED_STATUSES.has(gameStatus)) return null;

    return {
      guid,
      title,
      lat,
      lng,
      gameEntity,
      gameStatus
    };
  }

  function dedupe(pois) {
    const byGuid = new Map();
    for (const poi of pois) byGuid.set(poi.guid, poi);
    return [...byGuid.values()];
  }

  function counts(pois) {
    const result = {
      total: pois.length,
      pokestop: 0,
      gym: 0,
      powerspot: 0,
      active: 0,
      inactive: 0
    };

    for (const poi of pois) {
      if (poi.gameEntity === 'POKESTOP') result.pokestop++;
      if (poi.gameEntity === 'GYM') result.gym++;
      if (poi.gameEntity === 'POWERSPOT') {
        result.powerspot++;
        if (poi.gameStatus === 'ACTIVE') result.active++;
        if (poi.gameStatus === 'INACTIVE') result.inactive++;
      }
    }
    return result;
  }

  function render(payload) {
    const pois = Array.isArray(payload?.pois) ? payload.pois : [];
    const c = counts(pois);
    $('total').textContent = c.total;
    $('pokestop').textContent = c.pokestop;
    $('gym').textContent = c.gym;
    $('powerspot').textContent = c.powerspot;
    $('active').textContent = c.active;
    $('inactive').textContent = c.inactive;

    const status = $('status');
    if (c.total > 0) {
      status.className = 'status ok';
      status.textContent = `✅ ${c.total}件のPOIを受信しました`;
    } else {
      status.className = 'status warn';
      status.textContent = 'Bridgeからのデータを待っています…';
    }
  }

  function savePayload(payload) {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    window.CampsiteBridgeReceiver = Object.freeze({
      version: '0.3.0',
      payload,
      pois: payload.pois,
      counts: counts(payload.pois)
    });
    render(payload);
  }

  function receiveBridgePayload(data) {
    if (!data || data.type !== 'CAMPSITE_BRIDGE_POI_V1') return false;
    if (!Array.isArray(data.pois)) return false;

    const normalized = dedupe(data.pois.map(normalizePoi).filter(Boolean));
    const payload = {
      bridge: 'Campsite Bridge',
      protocol: 'CAMPSITE_BRIDGE_POI_V1',
      receivedAt: new Date().toISOString(),
      selectedBounds: data.selectedBounds || null,
      pois: normalized
    };

    savePayload(payload);
    return true;
  }

  window.addEventListener('message', event => {
    // 0.3 PoC: accept only Scopely Wayfarer as the sender.
    if (event.origin !== 'https://wayfarer.scopely.com') return;

    if (receiveBridgePayload(event.data) && event.source) {
      event.source.postMessage({
        type: 'CAMPSITE_BRIDGE_ACK_V1',
        accepted: true,
        count: window.CampsiteBridgeReceiver?.pois?.length || 0
      }, event.origin);
    }
  });

  $('clearBtn').addEventListener('click', () => {
    sessionStorage.removeItem(STORAGE_KEY);
    delete window.CampsiteBridgeReceiver;
    render({ pois: [] });
  });

  try {
    const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && Array.isArray(saved.pois)) {
      savePayload(saved);
    }
  } catch (_) {
    sessionStorage.removeItem(STORAGE_KEY);
  }

  window.CampsiteBridgeDevReceive = receiveBridgePayload;
})();
</script>
</body>
</html>
