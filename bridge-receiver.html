<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Campsite Bridge Receiver</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:none} body.bridge-dev{display:block}
    .wrap{max-width:560px;margin:0 auto;padding:28px 18px}.card{padding:20px;border:1px solid #334155;border-radius:16px;background:#0f172a;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    h1{margin:0 0 8px;font-size:22px}h2{margin:22px 0 10px;font-size:16px}.muted{color:#94a3b8;font-size:13px;line-height:1.7}.status{margin:18px 0;font-weight:800}.grid{display:grid;grid-template-columns:1fr auto;gap:8px 18px}.grid strong{text-align:right}.ok{color:#86efac}.warn{color:#fde68a}.error{color:#fca5a5}.adapter{margin-top:18px;padding:14px;border:1px solid #334155;border-radius:12px;background:#111827}button{margin-top:18px;width:100%;border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}#continueBtn{display:none;background:#dcfce7;color:#14532d}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>🌉 Campsite Bridge Receiver</h1>
  <div class="muted">Bridge専用の受け入れ口です。受信後はCampsite Design Toolへ自動で引き渡します。</div>
  <div id="status" class="status warn">Bridgeからのデータを待っています…</div>
  <div class="grid">
    <span>受信POI</span><strong id="total">0</strong>
    <span>PokéStop</span><strong id="pokestop">0</strong>
    <span>Gym</span><strong id="gym">0</strong>
    <span>Power Spot</span><strong id="powerspot">0</strong>
    <span>スポンサー</span><strong id="sponsored">0</strong>
    <span>SMR</span><strong id="smr">0</strong>
  </div>
  <div class="adapter">
    <h2>🔩 Campsite変換層</h2>
    <div id="adapterStatus" class="status warn">受信後に自動変換します</div>
    <div class="grid">
      <span>変換前</span><strong id="beforeCount">0</strong>
      <span>変換後</span><strong id="afterCount">0</strong>
      <span>変換失敗</span><strong id="failedCount">0</strong>
      <span>重複除外</span><strong id="duplicateCount">0</strong>
    </div>
  </div>
  <button id="continueBtn" type="button">🏕 Campsite Design Toolへ進む</button>
  <button id="clearBtn" type="button">受信データを消去</button>
</div></div>
<script>
(() => {
  'use strict';

  const VERSION = '0.8.8';
  const DEV_PARAM = 'campsiteBridgeDev';
  const STORAGE_KEY = 'campsiteBridgePoC.v0.3';
  const ADAPTER_STORAGE_KEY = 'campsiteBridgeAdapter.v0.3';
  const ALLOWED_ENTITIES = new Set(['POKESTOP','GYM','POWERSPOT']);
  const ALLOWED_STATUSES = new Set(['ACTIVE','INACTIVE','UNKNOWN']);
  const ALLOWED_PROVENANCE = new Set(['WAYFARER_PASSIVE','WFMM_CACHE','BRIDGE_ENRICHMENT']);
  const ALLOWED_ORIGINS = new Set([
    'https://wayfarer.scopely.com',
    'https://wayfarer.nianticlabs.com'
  ]);

  const params = new URLSearchParams(location.search);
  if (params.get(DEV_PARAM) !== '1') return;
  document.body.classList.add('bridge-dev');

  const $ = id => document.getElementById(id);
  let autoContinueTimer = null;

  function boolOrNull(value) {
    if (value === true || String(value).toLowerCase() === 'true') return true;
    if (value === false || String(value).toLowerCase() === 'false') return false;
    return null;
  }

  function normalizeProvenance(value) {
    const input = Array.isArray(value) ? value : value ? [value] : [];
    const result = [];
    for (const item of input) {
      const normalized = String(item || '').trim().toUpperCase();
      if (!ALLOWED_PROVENANCE.has(normalized) || result.includes(normalized)) continue;
      result.push(normalized);
    }
    return result;
  }

  function normalizePoi(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const guid = String(raw.guid || raw.sourceId || raw.id || '').trim();
    const title = String(raw.title || raw.name || '').trim();
    const lat = Number(raw.lat);
    const lng = Number(raw.lng);
    const gameEntity = String(raw.gameEntity || raw.type || '').trim().toUpperCase();
    const gameStatus = String(raw.gameStatus || 'UNKNOWN').trim().toUpperCase();
    if (!guid || !Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    if (!ALLOWED_ENTITIES.has(gameEntity) || !ALLOWED_STATUSES.has(gameStatus)) return null;
    return {
      guid,
      title,
      lat,
      lng,
      gameEntity,
      gameStatus,
      sponsored: raw.sponsored === true || String(raw.sponsored).toLowerCase() === 'true',
      smr: boolOrNull(raw.smr),
      imageUrl: String(raw.imageUrl || ''),
      description: String(raw.description || ''),
      s2L14: String(raw.s2L14 || ''),
      s2L17: String(raw.s2L17 || ''),
      provenance: normalizeProvenance(raw.provenance)
    };
  }

  function dedupeByGuid(pois) {
    const byGuid = new Map();
    let duplicateCount = 0;
    for (const poi of pois) {
      if (byGuid.has(poi.guid)) duplicateCount++;
      byGuid.set(poi.guid, poi);
    }
    return { pois:[...byGuid.values()], duplicateCount };
  }

  function counts(pois) {
    const result = { total:pois.length,pokestop:0,gym:0,powerspot:0,sponsored:0,smr:0 };
    for (const poi of pois) {
      if (poi.gameEntity === 'POKESTOP') result.pokestop++;
      if (poi.gameEntity === 'GYM') result.gym++;
      if (poi.gameEntity === 'POWERSPOT') result.powerspot++;
      if (poi.sponsored) result.sponsored++;
      if (poi.smr === true) result.smr++;
    }
    return result;
  }

  function toCampsitePoi(bridgePoi) {
    const poi = normalizePoi(bridgePoi);
    if (!poi) return null;
    return {
      name: poi.title,
      title: poi.title,
      lat: poi.lat,
      lng: poi.lng,
      type: poi.gameEntity,
      gameEntity: poi.gameEntity,
      gameStatus: poi.gameStatus,
      guid: poi.guid,
      importChannel: 'BRIDGE',
      sponsored: poi.sponsored,
      smr: poi.smr,
      imageUrl: poi.imageUrl,
      description: poi.description,
      s2L14: poi.s2L14,
      s2L17: poi.s2L17,
      provenance: poi.provenance
    };
  }

  function adaptForCampsite(bridgePois) {
    const input = Array.isArray(bridgePois) ? bridgePois : [];
    const converted = [];
    let failedCount = 0;
    for (const poi of input) {
      const convertedPoi = toCampsitePoi(poi);
      if (!convertedPoi) failedCount++;
      else converted.push(convertedPoi);
    }
    const deduped = dedupeByGuid(converted);
    return {
      beforeCount: input.length,
      afterCount: deduped.pois.length,
      failedCount,
      duplicateCount: deduped.duplicateCount,
      pois: deduped.pois,
      clean: input.length > 0 && failedCount === 0
    };
  }

  function render(payload) {
    const pois = Array.isArray(payload?.pois) ? payload.pois : [];
    const c = counts(pois);
    $('total').textContent = c.total;
    $('pokestop').textContent = c.pokestop;
    $('gym').textContent = c.gym;
    $('powerspot').textContent = c.powerspot;
    $('sponsored').textContent = c.sponsored;
    $('smr').textContent = c.smr;

    const status = $('status');
    status.className = `status ${c.total ? 'ok' : 'warn'}`;
    status.textContent = c.total ? `✅ ${c.total}件のPOIを受信しました` : 'Bridgeからのデータを待っています…';

    const adapter = adaptForCampsite(pois);
    $('beforeCount').textContent = adapter.beforeCount;
    $('afterCount').textContent = adapter.afterCount;
    $('failedCount').textContent = adapter.failedCount;
    $('duplicateCount').textContent = adapter.duplicateCount;

    const adapterStatus = $('adapterStatus');
    const continueBtn = $('continueBtn');
    if (adapter.clean && adapter.afterCount > 0) {
      adapterStatus.className = 'status ok';
      adapterStatus.textContent = `✅ ${adapter.afterCount}件をCampsite内部形式へ変換しました`;
      continueBtn.style.display = 'block';
    } else if (adapter.beforeCount > 0) {
      adapterStatus.className = 'status error';
      adapterStatus.textContent = '⚠ 変換できないPOIがあります';
      continueBtn.style.display = 'none';
    } else {
      adapterStatus.className = 'status warn';
      adapterStatus.textContent = '受信後に自動変換します';
      continueBtn.style.display = 'none';
    }

    sessionStorage.setItem(ADAPTER_STORAGE_KEY, JSON.stringify({
      version: VERSION,
      adaptedAt: new Date().toISOString(),
      sourceCount: adapter.beforeCount,
      duplicateCount: adapter.duplicateCount,
      pois: adapter.pois
    }));

    window.CampsiteBridgeAdapter = Object.freeze({
      version: VERSION,
      result: adapter,
      pois: adapter.pois
    });

    return adapter;
  }

  function savePayload(payload) {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    window.CampsiteBridgeReceiver = Object.freeze({
      version: VERSION,
      payload,
      pois: payload.pois,
      counts: counts(payload.pois)
    });
    return render(payload);
  }

  function receiveBridgePayload(data) {
    if (!data || data.type !== 'CAMPSITE_BRIDGE_POI_V1' || !Array.isArray(data.pois)) {
      return { accepted:false, count:0, reason:'invalid-payload' };
    }

    const normalizedRaw = data.pois.map(normalizePoi).filter(Boolean);
    const deduped = dedupeByGuid(normalizedRaw);
    const payload = {
      bridge: 'Campsite Bridge',
      bridgeVersion: String(data.bridgeVersion || ''),
      protocol: 'CAMPSITE_BRIDGE_POI_V1',
      schemaVersion: String(data.schemaVersion || '1.2'),
      receivedAt: new Date().toISOString(),
      selectedBounds: data.selectedBounds || null,
      pois: deduped.pois
    };
    const adapter = savePayload(payload);
    const accepted = data.pois.length > 0 && normalizedRaw.length === data.pois.length && adapter.clean;
    return { accepted, count: adapter.afterCount, sourceCount:data.pois.length, duplicateCount:deduped.duplicateCount };
  }

  function goToCampsite() {
    if (!window.CampsiteBridgeAdapter?.pois?.length) return;
    location.href = './bridge-gateway.html?campsiteBridgeImport=1';
  }

  function scheduleAutoContinue() {
    clearTimeout(autoContinueTimer);
    autoContinueTimer = setTimeout(goToCampsite, 650);
  }

  window.addEventListener('message', event => {
    if (!ALLOWED_ORIGINS.has(event.origin)) return;
    const result = receiveBridgePayload(event.data);
    if (event.data?.type !== 'CAMPSITE_BRIDGE_POI_V1') return;

    if (event.source) {
      event.source.postMessage({
        type: 'CAMPSITE_BRIDGE_ACK_V1',
        accepted: result.accepted,
        count: result.count,
        sourceCount: result.sourceCount,
        duplicateCount: result.duplicateCount || 0,
        receiverVersion: VERSION
      }, event.origin);
    }

    if (result.accepted && event.data.autoContinue !== false) {
      scheduleAutoContinue();
    }
  });

  function announceReady() {
    if (!window.opener) return;
    let targetOrigin = '*';
    try {
      const refOrigin = new URL(document.referrer).origin;
      if (ALLOWED_ORIGINS.has(refOrigin)) targetOrigin = refOrigin;
    } catch (_) {}
    window.opener.postMessage({ type:'CAMPSITE_BRIDGE_READY_V1', receiverVersion:VERSION }, targetOrigin);
  }

  $('continueBtn').addEventListener('click', goToCampsite);
  $('clearBtn').addEventListener('click', () => {
    clearTimeout(autoContinueTimer);
    sessionStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(ADAPTER_STORAGE_KEY);
    delete window.CampsiteBridgeReceiver;
    delete window.CampsiteBridgeAdapter;
    render({ pois:[] });
  });

  try {
    const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && Array.isArray(saved.pois)) savePayload(saved);
  } catch (_) {
    sessionStorage.removeItem(STORAGE_KEY);
  }

  window.CampsiteBridgeDevReceive = receiveBridgePayload;
  window.CampsiteBridgeToInternalPoi = toCampsitePoi;
  window.CampsiteBridgeAdaptForCampsite = adaptForCampsite;

  announceReady();
})();
</script>
</body>
</html>
