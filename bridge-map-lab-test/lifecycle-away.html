<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Lifecycle Away Test</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0b1118;color:#eef3f7}
    *{box-sizing:border-box}body{margin:0;background:#0b1118;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));padding:24px;border:1px solid #34404d;border-radius:16px;background:#111922}.tag{margin:0 0 8px;color:#ff9f7a;font-size:11px;font-weight:800;letter-spacing:.08em}h1{margin:0 0 12px;font-size:24px}.text{margin:0 0 20px;color:#aeb9c6;line-height:1.6}.back{width:100%;min-height:48px;border:1px solid #506071;border-radius:12px;background:#17212b;color:#eef3f7;font-size:16px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <p class="tag">PHASE 5-B2 / AWAY PAGE</p>
    <h1>別ページへ移動しました</h1>
    <p class="text">このページはSafariの「離れる → 戻る」を確認するためだけのページです。下のボタンで地図へ戻ってください。</p>
    <button class="back" type="button" onclick="history.back()">地図へ戻る</button>
  </main>
</body>
</html>
