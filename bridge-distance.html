<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>距離チェック | Campsite Project</title>
  <style>html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot strong{display:block;font-size:20px}.boot small{display:block;margin-top:9px;color:#94a3b8;line-height:1.7}</style>
</head>
<body>
  <div class="boot"><div><strong>🎨 → 📏 距離チェック</strong><small>CREATIVE MODEの設計結果を読み込んでいます…</small></div></div>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    if(params.get('campsiteProject')!=='bridge'){
      location.replace('./index.html');
      return;
    }
    fetch('./index.html',{cache:'no-store',credentials:'same-origin'})
      .then(response=>{if(!response.ok)throw new Error(`index.html ${response.status}`);return response.text()})
      .then(html=>{
        const script='<script src="js/bridge-distance-project.js?v=1"></'+'script>';
        const injected=html.includes('</body>')?html.replace('</body>',script+'</body>'):html+script;
        document.open();document.write(injected);document.close();
      })
      .catch(error=>{
        console.error('[Campsite Project] distance gateway failed',error);
        document.body.innerHTML='<div class="boot"><div><strong>⚠️ 距離チェックを読み込めませんでした</strong><small>ページを再読み込みしてください。</small></div></div>';
      });
  })();
  </script>
</body>
</html>
