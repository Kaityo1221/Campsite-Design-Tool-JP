<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Bridge Flow Recovery</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:0 auto;padding:28px 18px}.card{padding:22px;border:1px solid #334155;border-radius:18px;background:#0f172a;box-shadow:0 20px 56px rgba(0,0,0,.3)}h1{margin:0 0 8px;font-size:23px}.lead{color:#cbd5e1;line-height:1.75;font-size:14px}.state{margin:18px 0;padding:14px;border-radius:12px;border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.1);color:#dcfce7;font-weight:900}.state.legacy{border-color:rgba(251,191,36,.5);background:rgba(245,158,11,.1);color:#fef3c7}.actions{display:grid;gap:10px}.actions button,.actions a{min-height:48px;display:grid;place-items:center;border-radius:12px;border:1px solid #475569;text-decoration:none;font-weight:900;cursor:pointer}.standard{background:#16a34a;color:#ecfdf5}.legacy{background:#78350f;color:#fef3c7}.setup{background:#0c4a6e;color:#e0f2fe}.note{margin-top:16px;color:#94a3b8;font-size:12px;line-height:1.7}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>🛟 Bridge Flow Recovery</h1>
  <p class="lead">Campsite Bridgeは新しいProjectフローが標準です。このページは障害時にだけ旧フローへ戻すための非公開リカバリー画面です。</p>
  <div id="state" class="state">状態を確認中…</div>
  <div class="actions">
    <button id="standard" class="standard" type="button">標準の新フローへ戻す</button>
    <button id="legacy" class="legacy" type="button">緊急時のみ旧フローを使う</button>
    <a class="setup" href="./bridge-setup.html">🌉 Bridgeセットアップへ</a>
  </div>
  <p class="note">旧フローは緊急退避用です。通常は「標準の新フロー」を使用してください。切り替えはこのブラウザにだけ保存されます。</p>
</div></div>
<script>
(()=>{
  'use strict';
  const LEGACY_KEY='campsiteBridgeLegacyFlow.v1';
  const OLD_PREVIEW_KEY='campsiteBridgeNextPreview.v1';
  const state=document.getElementById('state');

  const render=()=>{
    const legacy=localStorage.getItem(LEGACY_KEY)==='1';
    state.classList.toggle('legacy',legacy);
    state.textContent=legacy
      ? '⚠️ このブラウザ：旧フロー緊急Fallback'
      : '✅ このブラウザ：標準の新フロー';
  };

  document.getElementById('standard').onclick=()=>{
    localStorage.removeItem(LEGACY_KEY);
    localStorage.removeItem(OLD_PREVIEW_KEY);
    render();
  };

  document.getElementById('legacy').onclick=()=>{
    localStorage.setItem(LEGACY_KEY,'1');
    localStorage.removeItem(OLD_PREVIEW_KEY);
    sessionStorage.removeItem('campsiteProject.v1');
    render();
  };

  render();
})();
</script>
</body>
</html>
