<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Bridge Next Preview</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:0 auto;padding:28px 18px}.card{padding:22px;border:1px solid #334155;border-radius:18px;background:#0f172a;box-shadow:0 20px 56px rgba(0,0,0,.3)}h1{margin:0 0 8px;font-size:23px}.lead{color:#cbd5e1;line-height:1.75;font-size:14px}.state{margin:18px 0;padding:14px;border-radius:12px;border:1px solid #475569;background:#111827;font-weight:900}.state.on{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1);color:#dcfce7}.actions{display:grid;gap:10px}.actions button,.actions a{min-height:48px;display:grid;place-items:center;border-radius:12px;border:1px solid #475569;text-decoration:none;font-weight:900;cursor:pointer}.enable{background:#16a34a;color:#ecfdf5}.disable{background:#1e293b;color:#e2e8f0}.setup{background:#0c4a6e;color:#e0f2fe}.note{margin-top:16px;color:#94a3b8;font-size:12px;line-height:1.7}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>🧪 Bridge Next Preview</h1>
  <p class="lead">この端末だけ、新しい Campsite Project フローを有効にします。通常ユーザーのBridge動作は変わりません。</p>
  <div id="state" class="state">状態を確認中…</div>
  <div class="actions">
    <button id="enable" class="enable" type="button">この端末で新フローをON</button>
    <button id="disable" class="disable" type="button">新フローをOFF</button>
    <a class="setup" href="./bridge-setup.html">🌉 Bridgeセットアップへ</a>
  </div>
  <p class="note">ONにしたあと、普段どおりWayfarerからBridgeで送信してください。ポリゴン確定後にCREATIVE MODEへ進めば新フロー成功です。テスト終了後はOFFに戻せます。</p>
</div></div>
<script>
(()=>{
  'use strict';
  const KEY='campsiteBridgeNextPreview.v1';
  const state=document.getElementById('state');
  const render=()=>{const on=localStorage.getItem(KEY)==='1';state.classList.toggle('on',on);state.textContent=on?'✅ この端末：新フロー ON':'○ この端末：新フロー OFF'};
  document.getElementById('enable').onclick=()=>{localStorage.setItem(KEY,'1');render()};
  document.getElementById('disable').onclick=()=>{localStorage.removeItem(KEY);sessionStorage.removeItem('campsiteProject.v1');render()};
  render();
})();
</script>
</body>
</html>
